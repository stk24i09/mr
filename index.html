<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>面接練習回数管理システム</title>

<style>

/* ========================================
   ページ全体
======================================== */

body{
    font-family:sans-serif;
    margin:30px;
    max-width:1400px;
}


/* ========================================
   ページタイトル
======================================== */

.page-title{
    text-align:center;
    margin-bottom:30px;
}


/* ========================================
   左右の画面
======================================== */

.container{
    display:flex;
    flex-direction:row;
    align-items:flex-start;
    gap:30px;
}

.left-panel{
    flex:1;
    min-width:400px;
}

.right-panel{
    flex:1;
    min-width:400px;
}


/* ========================================
   テーブル
======================================== */

table{
    border-collapse:collapse;
    width:100%;
}

th,td{
    border:1px solid #000;
    padding:10px;
    text-align:center;
}

th{
    background:#eeeeee;
}


/* ========================================
   生徒リンク
======================================== */

.student-link{
    color:blue;
    cursor:pointer;
    text-decoration:underline;
}

.student-link:hover{
    color:red;
}


/* ========================================
   面接履歴
======================================== */

#historyArea{
    border:1px solid #ccc;
    padding:15px;
    min-height:300px;
    background:#fafafa;
}


/* ========================================
   並び替え
======================================== */

.sortArea{
    margin-bottom:15px;
}

select{
    padding:5px;
    font-size:16px;
}

button{
    padding:6px 15px;
    font-size:16px;
    margin-left:15px;
    cursor:pointer;
}

button:hover{
    background:#eeeeee;
}


/* ========================================
   更新時間
======================================== */

#updateTime{
    margin-top:10px;
    color:#555;
}


/* ========================================
   試験日終了
======================================== */

.exam-finished{
    font-weight:bold;
}

</style>

</head>


<body>


<!-- =====================================
     ページタイトル
===================================== -->

<h1 class="page-title">
    面接練習回数一覧
</h1>



<!-- =====================================
     左右の画面
===================================== -->

<div class="container">


    <!-- =================================
         左側
    ================================== -->

    <div class="left-panel">


        <!-- =================================
             並び替え・更新
        ================================== -->

        <div class="sortArea">

            <label for="sortSelect">
                並び替え：
            </label>


            <select
                id="sortSelect"
                onchange="loadSummary()"
            >

                <!-- 生徒ID -->

                <option value="id-asc">
                    生徒ID順（昇順）
                </option>

                <option value="id-desc">
                    生徒ID順（降順）
                </option>


                <!-- 面接回数 -->

                <option value="count-desc">
                    回数順（多）
                </option>

                <option value="count-asc">
                    回数順（少）
                </option>


                <!-- 試験日 -->

                <option value="exam-asc">
                    試験日順（近い順）
                </option>

                <option value="exam-desc">
                    試験日順（遠い順）
                </option>

            </select>


            <button onclick="refreshData()">
                🔄 更新
            </button>


            <p id="updateTime"></p>

        </div>



        <!-- =================================
             生徒一覧
        ================================== -->

        <table id="summaryTable">

            <tr>

                <th>
                    試験日
                </th>

                <th>
                    生徒名 / ID
                </th>

                <th>
                    面接回数
                </th>

            </tr>

        </table>


    </div>



    <!-- =================================
         右側
    ================================== -->

    <div class="right-panel">


        <div id="historyArea">

            <h2>
                面接履歴
            </h2>

            <p>
                生徒名をクリックしてください。
            </p>

        </div>


    </div>


</div>



<script>


// ========================================
// GAS API
// ========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxYvNAx8TWTezWFp9V7G2UeXYkHGehDVWDdweIhdAnLaeqfzRhbpU8CONMt7CV45tj4/exec";



// ========================================
// ページを開いたとき
// ========================================

loadSummary();



// ========================================
// 更新ボタン
// ========================================

function refreshData(){

    loadSummary();

    let now = new Date();

    document.getElementById("updateTime").innerHTML =
        "最終更新：" +
        now.toLocaleString("ja-JP");

}



// ========================================
// 今日の日付を取得
// ========================================

function getToday(){

    const today = new Date();

    today.setHours(0,0,0,0);

    return today;

}



// ========================================
// 試験日をDateに変換
// ========================================

function getExamDate(dateText){

    if(
        !dateText ||
        dateText === "未設定"
    ){

        return null;

    }


    /*
     * GASから
     *
     * 2026/09/03
     *
     * の形式で送られてくるため、
     * / で分割してDateを作成する
     */

    const parts = dateText.split("/");


    if(parts.length !== 3){

        return null;

    }


    const year = Number(parts[0]);

    const month = Number(parts[1]);

    const day = Number(parts[2]);


    if(
        isNaN(year) ||
        isNaN(month) ||
        isNaN(day)
    ){

        return null;

    }


    const date = new Date(
        year,
        month - 1,
        day
    );


    date.setHours(0,0,0,0);


    return date;

}



// ========================================
// 試験日が過ぎているか確認
// ========================================

function isExamFinished(dateText){

    const examDate =
        getExamDate(dateText);


    if(examDate === null){

        return false;

    }


    const today =
        getToday();


    return examDate.getTime()
        < today.getTime();

}



// ========================================
// 今日から試験日までの日数
// ========================================

function getDaysUntilExam(dateText){

    const examDate =
        getExamDate(dateText);


    if(examDate === null){

        return null;

    }


    const today =
        getToday();


    const oneDay =
        1000 * 60 * 60 * 24;


    return Math.round(
        (
            examDate.getTime()
            -
            today.getTime()
        )
        /
        oneDay
    );

}



// ========================================
// 生徒IDを比較
// ========================================

function compareStudentId(a,b){

    return a.id.localeCompare(
        b.id,
        undefined,
        {
            numeric:true
        }
    );

}



// ========================================
// 一覧読み込み
// ========================================

function loadSummary(){


    // ====================================
    // 面接回数と試験日を取得
    // ====================================

    Promise.all([

        fetch(
            API_URL + "?mode=summary"
        )
        .then(response => response.json()),

        fetch(
            API_URL + "?mode=examDates"
        )
        .then(response => response.json())

    ])


    .then(function(results){


        const data =
            results[0];


        const examDates =
            results[1];



        // ==================================
        // 表のヘッダー
        // ==================================

        let html = `

        <tr>

            <th>
                試験日
            </th>

            <th>
                生徒名 / ID
            </th>

            <th>
                面接回数
            </th>

        </tr>

        `;



        // ==================================
        // 生徒データ作成
        // ==================================

        let students = [];


        for(let name in data){


            // 生徒IDを取得

            const idMatch =
                name.match(/\d+[a-zA-Z]\d+/);


            const studentId =
                idMatch
                    ? idMatch[0]
                    : name;



            const examDate =
                examDates[studentId] || "";



            students.push({

                name:name,

                id:studentId,

                count:
                    Number(data[name]) || 0,

                examDate:examDate,

                finished:
                    isExamFinished(examDate),

                daysUntil:
                    getDaysUntilExam(examDate)

            });

        }



        // ==================================
        // 並び替え
        // ==================================

        const sortType =
            document.getElementById(
                "sortSelect"
            ).value;



        // ==================================
        // ID昇順
        // ==================================

        if(sortType === "id-asc"){

            students.sort(function(a,b){

                return compareStudentId(a,b);

            });

        }



        // ==================================
        // ID降順
        // ==================================

        else if(sortType === "id-desc"){

            students.sort(function(a,b){

                return compareStudentId(b,a);

            });

        }



        // ==================================
        // 回数多い順
        // ==================================

        else if(sortType === "count-desc"){

            students.sort(function(a,b){

                if(b.count !== a.count){

                    return b.count - a.count;

                }


                return compareStudentId(a,b);

            });

        }



        // ==================================
        // 回数少ない順
        // ==================================

        else if(sortType === "count-asc"){

            students.sort(function(a,b){

                if(a.count !== b.count){

                    return a.count - b.count;

                }


                return compareStudentId(a,b);

            });

        }



        // ==================================
        // 試験日近い順
        // ==================================

        else if(sortType === "exam-asc"){

            students.sort(function(a,b){


                /*
                 * 未設定は最後
                 */

                if(
                    a.daysUntil === null &&
                    b.daysUntil === null
                ){

                    return compareStudentId(a,b);

                }


                if(a.daysUntil === null){

                    return 1;

                }


                if(b.daysUntil === null){

                    return -1;

                }



                /*
                 * =================================
                 * まだ試験日前の生徒
                 * =================================
                 *
                 * 未来の日付を優先
                 */

                if(
                    !a.finished &&
                    !b.finished
                ){

                    if(
                        a.daysUntil !==
                        b.daysUntil
                    ){

                        return (
                            a.daysUntil
                            -
                            b.daysUntil
                        );

                    }

                    return compareStudentId(a,b);

                }



                /*
                 * =================================
                 * Aが未来、Bが過去
                 * =================================
                 */

                if(
                    !a.finished &&
                    b.finished
                ){

                    return -1;

                }



                /*
                 * =================================
                 * Aが過去、Bが未来
                 * =================================
                 */

                if(
                    a.finished &&
                    !b.finished
                ){

                    return 1;

                }



                /*
                 * =================================
                 * 両方とも過去
                 * =================================
                 *
                 * 過去の中では、
                 * 最近試験日が過ぎた人を上
                 */

                if(
                    a.daysUntil !==
                    b.daysUntil
                ){

                    return (
                        b.daysUntil
                        -
                        a.daysUntil
                    );

                }


                return compareStudentId(a,b);

            });

        }



        // ==================================
        // 試験日遠い順
        // ==================================

        else if(sortType === "exam-desc"){

            students.sort(function(a,b){


                /*
                 * 未設定は最後
                 */

                if(
                    a.daysUntil === null &&
                    b.daysUntil === null
                ){

                    return compareStudentId(a,b);

                }


                if(a.daysUntil === null){

                    return 1;

                }


                if(b.daysUntil === null){

                    return -1;

                }



                /*
                 * =================================
                 * まだ試験日前の生徒
                 * =================================
                 *
                 * 今日から遠い人を上
                 */

                if(
                    !a.finished &&
                    !b.finished
                ){

                    if(
                        a.daysUntil !==
                        b.daysUntil
                    ){

                        return (
                            b.daysUntil
                            -
                            a.daysUntil
                        );

                    }

                    return compareStudentId(a,b);

                }



                /*
                 * =================================
                 * Aが未来、Bが過去
                 * =================================
                 */

                if(
                    !a.finished &&
                    b.finished
                ){

                    return -1;

                }



                /*
                 * =================================
                 * Aが過去、Bが未来
                 * =================================
                 */

                if(
                    a.finished &&
                    !b.finished
                ){

                    return 1;

                }



                /*
                 * =================================
                 * 両方とも過去
                 * =================================
                 */

                if(
                    a.daysUntil !==
                    b.daysUntil
                ){

                    return (
                        b.daysUntil
                        -
                        a.daysUntil
                    );

                }


                return compareStudentId(a,b);

            });

        }



        // ==================================
        // テーブル作成
        // ==================================

        students.forEach(function(student){


            // ==================================
            // 試験日表示
            // ==================================

            let examDateHtml = "";



            // 試験日未設定

            if(student.examDate === ""){

                examDateHtml =
                    "未設定";

            }


            // ==================================
            // 試験日が過ぎている
            // ==================================

            else if(student.finished){

                examDateHtml = `

                    <span class="exam-finished">

                        ${student.examDate} ✓

                    </span>

                `;

            }


            // ==================================
            // 試験日前
            // ==================================

            else{

                examDateHtml =
                    student.examDate;

            }



            html += `

            <tr>

                <td>
                    ${examDateHtml}
                </td>


                <td>

                    <span
                        class="student-link"
                        onclick="showHistory(
                            '${student.id}',
                            '${student.name}'
                        )"
                    >

                        ${student.name}

                    </span>

                </td>


                <td>

                    ${student.count}回

                </td>

            </tr>

            `;

        });



        // ==================================
        // 画面へ反映
        // ==================================

        document.getElementById(
            "summaryTable"
        ).innerHTML = html;


    })


    .catch(function(error){

        console.error(
            "エラーが発生しました:",
            error
        );

    });

}



// ========================================
// 面接履歴表示
// ========================================

function showHistory(
    studentId,
    studentName
){


    fetch(

        API_URL +
        "?mode=history&id=" +
        encodeURIComponent(studentId)

    )


    .then(response => response.json())


    .then(function(data){


        let html = `

        <h2>
            ${studentName} の面接履歴
        </h2>


        <table>

        <tr>

            <th>
                回数
            </th>

            <th>
                日時
            </th>

            <th>
                担当先生
            </th>

        </tr>

        `;



        // ==================================
        // 履歴なし
        // ==================================

        if(
            !data ||
            data.length === 0
        ){

            html += `

            <tr>

                <td colspan="3">

                    まだ面接練習の記録はありません。

                </td>

            </tr>

            `;

        }



        // ==================================
        // 履歴あり
        // ==================================

        else{

            for(
                let i = 0;
                i < data.length;
                i++
            ){

                let date =
                    new Date(data[i].date);



                html += `

                <tr>

                    <td>
                        ${i + 1}回目
                    </td>

                    <td>
                        ${date.toLocaleString(
                            "ja-JP"
                        )}
                    </td>

                    <td>
                        ${data[i].teacher}
                    </td>

                </tr>

                `;

            }

        }



        html += "</table>";



        document.getElementById(
            "historyArea"
        ).innerHTML = html;


    })


    .catch(function(error){

        console.error(
            "履歴取得エラー:",
            error
        );

    });

}


</script>


</body>

</html>
