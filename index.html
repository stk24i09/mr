<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<title>面接練習回数一覧</title>

<style>

body{
    font-family:sans-serif;
    margin:30px;
    max-width:1400px;
}


/* ========================================
   ページタイトル
======================================== */

.page-title{
    text-align:center;
    margin-bottom:30px;
}


/* ========================================
   左右の画面
======================================== */

.container{
    display:flex;
    gap:30px;
}

.left{
    flex:1;
    min-width:400px;
}

.right{
    flex:1;
    min-width:400px;
}


/* ========================================
   並び替え
======================================== */

.sortArea{
    margin-bottom:15px;
}

select{
    padding:5px;
    font-size:16px;
}

button{
    padding:6px 15px;
    font-size:16px;
    margin-left:15px;
}


/* ========================================
   テーブル
======================================== */

table{
    border-collapse:collapse;
    width:100%;
}

th,
td{
    border:1px solid #000;
    padding:10px;
}

th{
    background:#f2f2f2;
}


/* ========================================
   生徒名 / ID
======================================== */

.student-cell{
    text-align:center;
}

.student-link{
    color:blue;
    cursor:pointer;
    text-decoration:underline;
}

.student-link:hover{
    color:red;
}


/* ========================================
   面接回数
======================================== */

.count-cell{
    text-align:center;
}


/* ========================================
   試験日
======================================== */

.exam-date-cell{
    text-align:center;
}

.exam-active{
    font-weight:bold;
}

.exam-finished{
    font-weight:normal;
}


/* ========================================
   更新時間
======================================== */

#updateTime{
    margin-top:10px;
    color:#555;
}


/* ========================================
   履歴
======================================== */

#historyArea{
    border:1px solid #ccc;
    padding:15px;
    min-height:300px;
    background:#fafafa;
}

#historyArea h2{
    margin-top:0;
}

</style>

</head>


<body>


<h1 class="page-title">
    面接練習回数一覧
</h1>


<div class="container">


<!-- ========================================
     左側
======================================== -->

<div class="left">

    <div class="sortArea">

        <select id="sortSelect">

            <option value="id-asc">
                生徒ID順（昇順）
            </option>

            <option value="id-desc">
                生徒ID順（降順）
            </option>

            <option value="count-desc">
                回数順（多）
            </option>

            <option value="count-asc">
                回数順（少）
            </option>

            <option value="exam-asc">
                試験日順（近い順）
            </option>

            <option value="exam-desc">
                試験日順（遠い順）
            </option>

        </select>


        <button onclick="refreshData()">
            🔄 更新
        </button>

    </div>


    <table>

        <thead>

            <tr>

                <th>
                    試験日
                </th>

                <th>
                    生徒名 / ID
                </th>

                <th>
                    面接回数
                </th>

            </tr>

        </thead>


        <tbody id="summaryBody">
        </tbody>

    </table>


    <div id="updateTime">
        更新中...
    </div>

</div>


<!-- ========================================
     右側
======================================== -->

<div class="right">

    <h2>
        面接履歴
    </h2>


    <div id="historyArea">

        生徒IDをクリックしてください。

    </div>

</div>


</div>


<script>


/* ========================================
   GAS URL
======================================== */

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxYvNAx8TWTezWFp9V7G2UeXYkHGehDVWDdweIhdAnLaeqfzRhbpU8CONMt7CV45tj4/exec";


/* ========================================
   生徒データ
======================================== */

let students = [];


/* ========================================
   ページ読み込み
======================================== */

window.onload = function(){

    loadSummary();


    document
        .getElementById("sortSelect")
        .addEventListener(
            "change",
            function(){

                renderSummary();

            }
        );

};


/* ========================================
   データ読み込み
======================================== */

async function loadSummary(){

    try{

        /* ====================================
           面接回数取得
        ==================================== */

        const summaryResponse =
            await fetch(
                GAS_URL + "?mode=summary"
            );

        const summaryData =
            await summaryResponse.json();


        /* ====================================
           試験日取得
        ==================================== */

        const examResponse =
            await fetch(
                GAS_URL + "?mode=examDates"
            );

        const examData =
            await examResponse.json();


        students = [];


        /* ====================================
           今日の日付
        ==================================== */

        const today =
            new Date();

        today.setHours(
            0,
            0,
            0,
            0
        );


        /* ====================================
           生徒ごとの処理
        ==================================== */

        for(
            const studentName
            in summaryData
        ){

            /*
             * 生徒ID取得
             */

            const match =
                studentName.match(
                    /\d+[a-zA-Z]\d+/
                );


            if(!match){
                continue;
            }


            const studentId =
                match[0];


            /*
             * 生徒名取得
             */

            const displayName =
                studentName
                    .replace(
                        studentId,
                        ""
                    )
                    .trim();


            /*
             * 試験日一覧
             */

            const examList =
                examData[studentId] || [];


            /*
             * 試験日を解析
             */

            const parsedExamDates =
                examList.map(
                    function(dateText, index){

                        const parts =
                            String(
                                dateText
                            ).split("/");


                        /*
                         * 日付として解析できない場合
                         */

                        if(
                            parts.length !== 3
                        ){

                            return {

                                text:
                                    dateText,

                                date:
                                    null,

                                daysUntil:
                                    null,

                                originalIndex:
                                    index

                            };

                        }


                        const year =
                            Number(parts[0]);

                        const month =
                            Number(parts[1]);

                        const day =
                            Number(parts[2]);


                        const examDate =
                            new Date(
                                year,
                                month - 1,
                                day
                            );


                        examDate.setHours(
                            0,
                            0,
                            0,
                            0
                        );


                        /*
                         * 今日から何日後か
                         */

                        const diff =
                            examDate - today;


                        const daysUntil =
                            Math.floor(
                                diff /
                                (1000 * 60 * 60 * 24)
                            );


                        return {

                            text:
                                year +
                                "/" +
                                String(month)
                                    .padStart(2,"0") +
                                "/" +
                                String(day)
                                    .padStart(2,"0"),

                            date:
                                examDate,

                            daysUntil:
                                daysUntil,

                            originalIndex:
                                index

                        };

                    }
                );


            /*
             * ====================================
             * 今日以降の試験日
             * ====================================
             */

            const unfinishedDates =
                parsedExamDates.filter(
                    function(item){

                        return (
                            item.daysUntil !== null &&
                            item.daysUntil >= 0
                        );

                    }
                );


            /*
             * ====================================
             * 近い順
             * ====================================
             */

            const nearestDateList =
                [...unfinishedDates].sort(
                    function(a,b){

                        return (
                            a.daysUntil -
                            b.daysUntil
                        );

                    }
                );


            /*
             * ====================================
             * 遠い順
             * ====================================
             */

            const farthestDateList =
                [...unfinishedDates].sort(
                    function(a,b){

                        return (
                            b.daysUntil -
                            a.daysUntil
                        );

                    }
                );


            /*
             * ====================================
             * 試験日状態
             * ====================================
             *
             * 0 = 未終了試験日あり
             * 1 = 全て終了
             * 2 = 試験日なし
             */

            let examStatus;


            if(
                unfinishedDates.length > 0
            ){

                examStatus = 0;

            }
            else if(
                parsedExamDates.length > 0
            ){

                examStatus = 1;

            }
            else{

                examStatus = 2;

            }


            /*
             * ====================================
             * 生徒データ保存
             * ====================================
             */

            students.push({

                id:
                    studentId,

                name:
                    displayName,

                count:
                    summaryData[studentName],

                examDates:
                    parsedExamDates,

                nearestDateList:
                    nearestDateList,

                farthestDateList:
                    farthestDateList,

                examStatus:
                    examStatus

            });

        }


        /*
         * 表示
         */

        renderSummary();


        /*
         * 更新時間
         */

        document.getElementById(
            "updateTime"
        ).textContent =
            "最終更新：" +
            new Date().toLocaleString(
                "ja-JP"
            );


    }
    catch(error){

        console.error(error);


        document.getElementById(
            "updateTime"
        ).textContent =
            "データの取得に失敗しました。";

    }

}


/* ========================================
   表示
======================================== */

function renderSummary(){

    const sortType =
        document.getElementById(
            "sortSelect"
        ).value;


    /*
     * ====================================
     * 試験日順の場合
     *
     * 「試験日1件 = 1行」
     * にする
     * ====================================
     */

    if(
        sortType === "exam-asc" ||
        sortType === "exam-desc"
    ){

        renderExamDateSummary(
            sortType
        );

        return;

    }


    /*
     * ====================================
     * 通常の表示
     *
     * 1人 = 1行
     * ====================================
     */

    const sortedStudents =
        [...students];


    /* ========================================
       ID 昇順
    ======================================== */

    if(
        sortType === "id-asc"
    ){

        sortedStudents.sort(
            function(a,b){

                return compareId(
                    a.id,
                    b.id
                );

            }
        );

    }


    /* ========================================
       ID 降順
    ======================================== */

    else if(
        sortType === "id-desc"
    ){

        sortedStudents.sort(
            function(a,b){

                return compareId(
                    b.id,
                    a.id
                );

            }
        );

    }


    /* ========================================
       回数 多い順
    ======================================== */

    else if(
        sortType === "count-desc"
    ){

        sortedStudents.sort(
            function(a,b){

                if(
                    b.count !== a.count
                ){

                    return (
                        b.count -
                        a.count
                    );

                }


                return compareId(
                    a.id,
                    b.id
                );

            }
        );

    }


    /* ========================================
       回数 少ない順
    ======================================== */

    else if(
        sortType === "count-asc"
    ){

        sortedStudents.sort(
            function(a,b){

                if(
                    a.count !== b.count
                ){

                    return (
                        a.count -
                        b.count
                    );

                }


                return compareId(
                    a.id,
                    b.id
                );

            }
        );

    }


    /*
     * ====================================
     * テーブル表示
     * ====================================
     */

    const tbody =
        document.getElementById(
            "summaryBody"
        );


    tbody.innerHTML = "";


    sortedStudents.forEach(
        function(student){

            const tr =
                document.createElement(
                    "tr"
                );


            /* ====================================
               試験日
            ==================================== */

            const examTd =
                document.createElement(
                    "td"
                );


            examTd.className =
                "exam-date-cell";


            if(
                student.examDates.length === 0
            ){

                examTd.textContent =
                    "未設定";

            }
            else{

                student.examDates.forEach(
                    function(exam){

                        const div =
                            document.createElement(
                                "div"
                            );


                        if(
                            exam.daysUntil !== null &&
                            exam.daysUntil < 0
                        ){

                            div.className =
                                "exam-finished";

                            div.textContent =
                                exam.text +
                                " ✅";

                        }
                        else{

                            div.className =
                                "exam-active";

                            div.textContent =
                                exam.text;

                        }


                        examTd.appendChild(
                            div
                        );

                    }
                );

            }


            /* ====================================
               生徒名 / ID
            ==================================== */

            const nameTd =
                document.createElement(
                    "td"
                );


            nameTd.className =
                "student-cell";


            const studentLink =
                document.createElement(
                    "span"
                );


            studentLink.className =
                "student-link";


            studentLink.textContent =
                student.name +
                " " +
                student.id;


            studentLink.onclick =
                function(){

                    showHistory(
                        student.id,
                        student.name +
                        " " +
                        student.id
                    );

                };


            nameTd.appendChild(
                studentLink
            );


            /* ====================================
               面接回数
            ==================================== */

            const countTd =
                document.createElement(
                    "td"
                );


            countTd.className =
                "count-cell";


            countTd.textContent =
                student.count +
                "回";


            /* ====================================
               行追加
            ==================================== */

            tr.appendChild(
                examTd
            );

            tr.appendChild(
                nameTd
            );

            tr.appendChild(
                countTd
            );


            tbody.appendChild(
                tr
            );

        }
    );

}


/* ========================================
   試験日順専用表示
======================================== */

function renderExamDateSummary(
    sortType
){

    const tbody =
        document.getElementById(
            "summaryBody"
        );


    tbody.innerHTML = "";


    /*
     * ====================================
     * 1行ごとのデータを作る
     *
     * 例：
     *
     * Bさん
     * 2026/09/30
     *
     * Bさん
     * 2027/02/22
     *
     * Bさん
     * 2026/08/23
     *
     * のように分解する
     * ====================================
     */

    const rows = [];


    students.forEach(
        function(student){

            /*
             * 試験日がない場合
             */

            if(
                student.examDates.length === 0
            ){

                rows.push({

                    student:
                        student,

                    exam:
                        null,

                    originalIndex:
                        9999

                });

                return;

            }


            /*
             * 試験日1件ごとに
             * 1行作る
             */

            student.examDates.forEach(
                function(exam){

                    rows.push({

                        student:
                            student,

                        exam:
                            exam,

                        originalIndex:
                            exam.originalIndex

                    });

                }
            );

        }
    );


    /*
     * ====================================
     * 近い順
     * ====================================
     */

    if(
        sortType === "exam-asc"
    ){

        rows.sort(
            function(a,b){

                /*
                 * 試験日がない人は最後
                 */

                if(
                    a.exam === null &&
                    b.exam !== null
                ){

                    return 1;

                }

                if(
                    a.exam !== null &&
                    b.exam === null
                ){

                    return -1;

                }


                /*
                 * 両方とも試験日なし
                 */

                if(
                    a.exam === null &&
                    b.exam === null
                ){

                    return compareId(
                        a.student.id,
                        b.student.id
                    );

                }


                /*
                 * 今日以降を先にする
                 */

                const aFinished =
                    a.exam.daysUntil < 0;

                const bFinished =
                    b.exam.daysUntil < 0;


                if(
                    aFinished !== bFinished
                ){

                    return aFinished ? 1 : -1;

                }


                /*
                 * 両方とも未終了
                 */

                if(
                    !aFinished &&
                    !bFinished
                ){

                    if(
                        a.exam.daysUntil !==
                        b.exam.daysUntil
                    ){

                        return (
                            a.exam.daysUntil -
                            b.exam.daysUntil
                        );

                    }

                }


                /*
                 * 両方とも過去の場合は
                 * 元のB → C → D順を維持
                 */

                if(
                    aFinished &&
                    bFinished
                ){

                    if(
                        a.student.id ===
                        b.student.id
                    ){

                        return (
                            a.originalIndex -
                            b.originalIndex
                        );

                    }

                }


                /*
                 * 同じ試験日の場合はID順
                 */

                return compareId(
                    a.student.id,
                    b.student.id
                );

            }
        );

    }


    /*
     * ====================================
     * 遠い順
     * ====================================
     */

    else if(
        sortType === "exam-desc"
    ){

        rows.sort(
            function(a,b){

                /*
                 * 試験日がない人は最後
                 */

                if(
                    a.exam === null &&
                    b.exam !== null
                ){

                    return 1;

                }

                if(
                    a.exam !== null &&
                    b.exam === null
                ){

                    return -1;

                }


                /*
                 * 両方とも試験日なし
                 */

                if(
                    a.exam === null &&
                    b.exam === null
                ){

                    return compareId(
                        a.student.id,
                        b.student.id
                    );

                }


                /*
                 * 今日以降を先にする
                 */

                const aFinished =
                    a.exam.daysUntil < 0;

                const bFinished =
                    b.exam.daysUntil < 0;


                if(
                    aFinished !== bFinished
                ){

                    return aFinished ? 1 : -1;

                }


                /*
                 * 両方とも未終了
                 */

                if(
                    !aFinished &&
                    !bFinished
                ){

                    if(
                        a.exam.daysUntil !==
                        b.exam.daysUntil
                    ){

                        return (
                            b.exam.daysUntil -
                            a.exam.daysUntil
                        );

                    }

                }


                /*
                 * 過去の日付は
                 * 元のB → C → D順
                 */

                if(
                    aFinished &&
                    bFinished
                ){

                    if(
                        a.student.id ===
                        b.student.id
                    ){

                        return (
                            a.originalIndex -
                            b.originalIndex
                        );

                    }

                }


                /*
                 * 同じ試験日の場合はID順
                 */

                return compareId(
                    a.student.id,
                    b.student.id
                );

            }
        );

    }


    /*
     * ====================================
     * 行を画面に表示
     * ====================================
     */

    rows.forEach(
        function(row){

            const student =
                row.student;

            const exam =
                row.exam;


            const tr =
                document.createElement(
                    "tr"
                );


            /* ====================================
               試験日
            ==================================== */

            const examTd =
                document.createElement(
                    "td"
                );


            examTd.className =
                "exam-date-cell";


            if(
                exam === null
            ){

                examTd.textContent =
                    "未設定";

            }
            else{

                if(
                    exam.daysUntil !== null &&
                    exam.daysUntil < 0
                ){

                    examTd.className =
                        "exam-date-cell exam-finished";

                    examTd.textContent =
                        exam.text +
                        " ✅";

                }
                else{

                    examTd.className =
                        "exam-date-cell exam-active";

                    examTd.textContent =
                        exam.text;

                }

            }


            /* ====================================
               生徒名 / ID
            ==================================== */

            const nameTd =
                document.createElement(
                    "td"
                );


            nameTd.className =
                "student-cell";


            const studentLink =
                document.createElement(
                    "span"
                );


            studentLink.className =
                "student-link";


            studentLink.textContent =
                student.name +
                " " +
                student.id;


            studentLink.onclick =
                function(){

                    showHistory(
                        student.id,
                        student.name +
                        " " +
                        student.id
                    );

                };


            nameTd.appendChild(
                studentLink
            );


            /* ====================================
               面接回数
            ==================================== */

            const countTd =
                document.createElement(
                    "td"
                );


            countTd.className =
                "count-cell";


            countTd.textContent =
                student.count +
                "回";


            /* ====================================
               行追加
            ==================================== */

            tr.appendChild(
                examTd
            );

            tr.appendChild(
                nameTd
            );

            tr.appendChild(
                countTd
            );


            tbody.appendChild(
                tr
            );

        }
    );

}


/* ========================================
   ID比較
======================================== */

function compareId(a,b){

    return a.localeCompare(
        b,
        undefined,
        {
            numeric:true,
            sensitivity:"base"
        }
    );

}


/* ========================================
   面接履歴
======================================== */

async function showHistory(
    studentId,
    studentName
){

    const historyArea =
        document.getElementById(
            "historyArea"
        );


    historyArea.innerHTML =
        "読み込み中...";


    try{

        const response =
            await fetch(
                GAS_URL +
                "?mode=history&id=" +
                encodeURIComponent(
                    studentId
                )
            );


        const history =
            await response.json();


        let html =
            "<h2>" +
            studentName +
            " の面接履歴" +
            "</h2>";


        if(
            history.length === 0
        ){

            html +=
                "<p>面接履歴はありません。</p>";

        }
        else{

            html +=
                "<table>";

            html +=
                "<thead>";

            html +=
                "<tr>";

            html +=
                "<th>回数</th>";

            html +=
                "<th>日時</th>";

            html +=
                "<th>担当先生</th>";

            html +=
                "</tr>";

            html +=
                "</thead>";

            html +=
                "<tbody>";


            history.forEach(
                function(item,index){

                    const date =
                        new Date(
                            item.date
                        );


                    html +=
                        "<tr>";

                    html +=
                        "<td>" +
                        (index + 1) +
                        "回目" +
                        "</td>";

                    html +=
                        "<td>" +
                        date.toLocaleString(
                            "ja-JP"
                        ) +
                        "</td>";

                    html +=
                        "<td>" +
                        item.teacher +
                        "</td>";

                    html +=
                        "</tr>";

                }
            );


            html +=
                "</tbody>";

            html +=
                "</table>";

        }


        historyArea.innerHTML =
            html;

    }
    catch(error){

        console.error(error);


        historyArea.innerHTML =
            "履歴の取得に失敗しました。";

    }

}


/* ========================================
   更新
======================================== */

function refreshData(){

    loadSummary();

}

</script>


</body>

</html>
