<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>面接練習回数管理システム</title>

<style>

body{
    font-family:sans-serif;
    margin:30px;
    max-width:1400px;
}

/* ========================================
   ページタイトル
======================================== */

.page-title{
    text-align:center;
    margin-bottom:30px;
}


/* ========================================
   左右の画面
======================================== */

.container{
    display:flex;
    flex-direction:row;
    align-items:flex-start;
    gap:30px;
}


/* ========================================
   左側
======================================== */

.left-panel{
    flex:1;
    min-width:400px;
}


/* ========================================
   右側
======================================== */

.right-panel{
    flex:1;
    min-width:400px;
}


/* ========================================
   テーブル
======================================== */

table{
    border-collapse:collapse;
    width:100%;
}

th,td{
    border:1px solid #000;
    padding:10px;
    text-align:center;
}

th{
    background:#eeeeee;
}


/* ========================================
   生徒リンク
======================================== */

.student-link{
    color:blue;
    cursor:pointer;
    text-decoration:underline;
}

.student-link:hover{
    color:red;
}


/* ========================================
   面接履歴
======================================== */

#historyArea{
    border:1px solid #ccc;
    padding:15px;
    min-height:300px;
    background:#fafafa;
}


/* ========================================
   並び替え
======================================== */

.sortArea{
    margin-bottom:15px;
}

select{
    padding:5px;
    font-size:16px;
}


/* ========================================
   更新ボタン
======================================== */

button{
    padding:6px 15px;
    font-size:16px;
    margin-left:15px;
    cursor:pointer;
}

button:hover{
    background:#eeeeee;
}


/* ========================================
   更新時刻
======================================== */

#updateTime{
    margin-top:10px;
    color:#555;
}

</style>

</head>


<body>


<!-- ========================================
     ページタイトル
======================================== -->

<h1 class="page-title">
    面接練習回数一覧
</h1>



<div class="container">


<!-- ========================================
     左側：生徒一覧
======================================== -->

<div class="left-panel">


<div class="sortArea">

<label for="sortSelect">
    並び替え：
</label>


<select id="sortSelect" onchange="loadSummary()">

    <option value="id">
        生徒ID順
    </option>

    <option value="count">
        面接回数順
    </option>

</select>


<button onclick="refreshData()">
    🔄 更新
</button>


<p id="updateTime"></p>

</div>



<table id="summaryTable">

<tr>

<th>
    生徒名 / ID
</th>

<th>
    面接回数
</th>

</tr>

</table>


</div>



<!-- ========================================
     右側：面接履歴
======================================== -->

<div class="right-panel">

<div id="historyArea">

<h2>
    面接履歴
</h2>

<p>
    生徒名をクリックしてください。
</p>

</div>

</div>


</div>



<script>


// ========================================
// API
// ========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxYvNAx8TWTezWFp9V7G2UeXYkHGehDVWDdweIhdAnLaeqfzRhbpU8CONMt7CV45tj4/exec";


loadSummary();



// ========================================
// 更新
// ========================================

function refreshData(){

    loadSummary();

    let now = new Date();

    document.getElementById("updateTime").innerHTML =
        "最終更新：" +
        now.toLocaleString("ja-JP");

}



// ========================================
// 生徒IDを取り出す
// ========================================

function getStudentId(name){

    /*
        例：

        山田 太郎 24i25

        ↓

        24i25
    */

    const match =
        name.match(/\d+[a-zA-Z]\d+/);

    if(match){

        return match[0];

    }

    /*
        ID形式が見つからない場合は
        元の値をそのまま返す
    */

    return name;

}



// ========================================
// 生徒ID比較
// ========================================

function compareStudentId(a,b){

    const idA =
        getStudentId(a);

    const idB =
        getStudentId(b);

    return idA.localeCompare(
        idB,
        undefined,
        {
            numeric:true
        }
    );

}



// ========================================
// 面接回数一覧
// ========================================

function loadSummary(){


fetch(API_URL + "?mode=summary")


.then(response => response.json())


.then(data => {


let html = `

<tr>

<th>
    生徒名 / ID
</th>

<th>
    面接回数
</th>

</tr>

`;


let students = [];



for(let name in data){

    students.push({

        name:name,

        count:Number(data[name]) || 0

    });

}



const sortType =
    document.getElementById("sortSelect").value;



// ========================================
// 面接回数順
// ========================================

if(sortType == "count"){


    students.sort(function(a,b){


        // ① 面接回数を優先

        if(b.count !== a.count){

            return b.count - a.count;

        }


        // ② 同じ回数なら生徒ID順

        return compareStudentId(
            a.name,
            b.name
        );


    });


}



// ========================================
// 生徒ID順
// ========================================

else{


    students.sort(function(a,b){

        return compareStudentId(
            a.name,
            b.name
        );

    });


}



// ========================================
// テーブル作成
// ========================================

students.forEach(function(student){


html += `

<tr>

<td>

<span
class="student-link"
onclick="showHistory('${student.name}')">

${student.name}

</span>

</td>


<td>

${student.count}回

</td>

</tr>

`;

});


document.getElementById("summaryTable").innerHTML =
    html;


})


.catch(error => {

    console.error(
        "一覧取得エラー:",
        error
    );

});


}



// ========================================
// 面接履歴表示
// ========================================

function showHistory(studentName){


    // ------------------------------------
    // ここが今回の重要な部分
    // ------------------------------------

    const studentId =
        getStudentId(studentName);


    console.log(
        "表示名：",
        studentName
    );

    console.log(
        "検索する生徒ID：",
        studentId
    );



    fetch(

        API_URL +
        "?mode=history&id=" +
        encodeURIComponent(studentId)

    )


    .then(response => response.json())


    .then(data => {


        let html = `

        <h2>
            ${studentName} の面接履歴
        </h2>


        <table>

        <tr>

        <th>
            回数
        </th>

        <th>
            日時
        </th>

        <th>
            担当先生
        </th>

        </tr>

        `;



        if(!data || data.length === 0){


            html += `

            <tr>

            <td colspan="3">

                まだ面接練習の記録はありません。

            </td>

            </tr>

            `;


        }


        else{


            for(
                let i = 0;
                i < data.length;
                i++
            ){


                let date =
                    new Date(data[i].date);


                html += `

                <tr>

                <td>
                    ${i+1}回目
                </td>

                <td>
                    ${date.toLocaleString("ja-JP")}
                </td>

                <td>
                    ${data[i].teacher}
                </td>

                </tr>

                `;

            }


        }


        html += "</table>";


        document.getElementById("historyArea").innerHTML =
            html;


    })


    .catch(error => {

        console.error(
            "履歴取得エラー:",
            error
        );


        document.getElementById("historyArea").innerHTML = `

        <h2>
            面接履歴
        </h2>

        <p>
            履歴の取得中にエラーが発生しました。
        </p>

        `;

    });


}


</script>


</body>

</html>
