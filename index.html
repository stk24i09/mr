<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<title>面接練習回数一覧</title>

<style>

body{
    font-family:sans-serif;
    margin:30px;
    max-width:1400px;
}


/* ========================================
   ページタイトル
======================================== */

.page-title{
    text-align:center;
    margin-bottom:30px;
}


/* ========================================
   左右の画面
======================================== */

.container{
    display:flex;
    gap:30px;
}

.left{
    flex:1;
    min-width:400px;
}

.right{
    flex:1;
    min-width:400px;
}


/* ========================================
   並び替え
======================================== */

.sortArea{
    margin-bottom:15px;
}

select{
    padding:5px;
    font-size:16px;
}

button{
    padding:6px 15px;
    font-size:16px;
    margin-left:15px;
}


/* ========================================
   テーブル
======================================== */

table{
    border-collapse:collapse;
    width:100%;
}

th,
td{
    border:1px solid #000;
    padding:10px;
}

th{
    background:#f2f2f2;
}


/* ========================================
   生徒名 / ID
======================================== */

.student-cell{
    text-align:center;
}

.student-link{
    color:blue;
    cursor:pointer;
    text-decoration:underline;
}

.student-link:hover{
    color:red;
}


/* ========================================
   面接回数
======================================== */

.count-cell{
    text-align:center;
}


/* ========================================
   試験日
======================================== */

.exam-date-cell{
    text-align:center;
}

.exam-date-list{
    line-height:1.8;
}

.exam-active{
    font-weight:bold;
}

.exam-finished{
    font-weight:normal;
}


/* ========================================
   更新時間
======================================== */

#updateTime{
    margin-top:10px;
    color:#555;
}


/* ========================================
   履歴
======================================== */

#historyArea{
    border:1px solid #ccc;
    padding:15px;
    min-height:300px;
    background:#fafafa;
}

#historyArea h2{
    margin-top:0;
}

</style>

</head>


<body>


<h1 class="page-title">
    面接練習回数一覧
</h1>


<div class="container">


<!-- ========================================
     左側
======================================== -->

<div class="left">

    <div class="sortArea">

        <select id="sortSelect">

            <option value="id-asc">
                生徒ID順（昇順）
            </option>

            <option value="id-desc">
                生徒ID順（降順）
            </option>

            <option value="count-desc">
                回数順（多）
            </option>

            <option value="count-asc">
                回数順（少）
            </option>

            <option value="exam-asc">
                試験日順（近い順）
            </option>

            <option value="exam-desc">
                試験日順（遠い順）
            </option>

        </select>


        <button onclick="refreshData()">
            🔄 更新
        </button>

    </div>


    <table>

        <thead>

            <tr>

                <th>
                    試験日
                </th>

                <th>
                    生徒名 / ID
                </th>

                <th>
                    面接回数
                </th>

            </tr>

        </thead>


        <tbody id="summaryBody">
        </tbody>

    </table>


    <div id="updateTime">
        更新中...
    </div>

</div>


<!-- ========================================
     右側
======================================== -->

<div class="right">

    <h2>
        面接履歴
    </h2>


    <div id="historyArea">

        生徒IDをクリックしてください。

    </div>

</div>


</div>


<script>


/* ========================================
   GAS URL
======================================== */

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxYvNAx8TWTezWFp9V7G2UeXYkHGehDVWDdweIhdAnLaeqfzRhbpU8CONMt7CV45tj4/exec";


/* ========================================
   生徒データ
======================================== */

let students = [];


/* ========================================
   ページ読み込み
======================================== */

window.onload = function(){

    loadSummary();


    document
        .getElementById("sortSelect")
        .addEventListener(
            "change",
            function(){

                renderSummary();

            }
        );

};


/* ========================================
   データ読み込み
======================================== */

async function loadSummary(){

    try{

        /* ====================================
           面接回数取得
        ==================================== */

        const summaryResponse =
            await fetch(
                GAS_URL + "?mode=summary"
            );

        const summaryData =
            await summaryResponse.json();


        /* ====================================
           試験日取得
        ==================================== */

        const examResponse =
            await fetch(
                GAS_URL + "?mode=examDates"
            );

        const examData =
            await examResponse.json();


        students = [];


        /* ====================================
           今日の日付
        ==================================== */

        const today =
            new Date();

        today.setHours(
            0,
            0,
            0,
            0
        );


        /* ====================================
           生徒ごとの処理
        ==================================== */

        for(
            const studentName
            in summaryData
        ){

            /*
             * 生徒ID取得
             *
             * 例：
             * 佐藤 一真24i15
             *
             * ↓
             * 24i15
             */

            const match =
                studentName.match(
                    /\d+[a-zA-Z]\d+/
                );


            if(!match){
                continue;
            }


            const studentId =
                match[0];


            /*
             * 生徒名取得
             */

            const displayName =
                studentName
                    .replace(
                        studentId,
                        ""
                    )
                    .trim();


            /*
             * 試験日一覧
             */

            const examList =
                examData[studentId] || [];


            /*
             * 試験日を解析
             */

            const parsedExamDates =
                examList.map(
                    function(dateText){

                        const parts =
                            String(
                                dateText
                            ).split("/");


                        /*
                         * 日付として解析できない場合
                         */

                        if(
                            parts.length !== 3
                        ){

                            return {

                                text:
                                    dateText,

                                date:
                                    null,

                                daysUntil:
                                    null,

                                originalIndex:
                                    examList.indexOf(
                                        dateText
                                    )

                            };

                        }


                        const year =
                            Number(parts[0]);

                        const month =
                            Number(parts[1]);

                        const day =
                            Number(parts[2]);


                        const examDate =
                            new Date(
                                year,
                                month - 1,
                                day
                            );


                        examDate.setHours(
                            0,
                            0,
                            0,
                            0
                        );


                        /*
                         * 今日から何日後か
                         */

                        const diff =
                            examDate - today;


                        const daysUntil =
                            Math.floor(
                                diff /
                                (1000 * 60 * 60 * 24)
                            );


                        return {

                            text:
                                year +
                                "/" +
                                String(month)
                                    .padStart(2,"0") +
                                "/" +
                                String(day)
                                    .padStart(2,"0"),

                            date:
                                examDate,

                            daysUntil:
                                daysUntil

                        };

                    }
                );


            /*
             * ====================================
             * 今日以降の試験日だけ取得
             * ====================================
             *
             * 過去の日付はここでは除外する
             */

            const unfinishedDates =
                parsedExamDates.filter(
                    function(item){

                        return (
                            item.daysUntil !== null &&
                            item.daysUntil >= 0
                        );

                    }
                );


            /*
             * ====================================
             * 未終了試験日を近い順にする
             * ====================================
             */

            const nearestDateList =
                [...unfinishedDates].sort(
                    function(a,b){

                        return (
                            a.daysUntil -
                            b.daysUntil
                        );

                    }
                );


            /*
             * ====================================
             * 未終了試験日を遠い順にする
             * ====================================
             */

            const farthestDateList =
                [...unfinishedDates].sort(
                    function(a,b){

                        return (
                            b.daysUntil -
                            a.daysUntil
                        );

                    }
                );


            /*
             * ====================================
             * 表示用の試験日リスト
             * ====================================
             *
             * 通常：
             * B → C → D
             *
             * 近い順：
             * 未終了を近い順 → 終了済み
             *
             * 遠い順：
             * 未終了を遠い順 → 終了済み
             */

            let examDisplayList;


            const sortType =
                document.getElementById(
                    "sortSelect"
                )?.value || "id-asc";


            if(
                sortType === "exam-asc"
            ){

                const finishedDates =
                    parsedExamDates.filter(
                        function(item){

                            return (
                                item.daysUntil !== null &&
                                item.daysUntil < 0
                            );

                        }
                    );


                examDisplayList =
                    [
                        ...nearestDateList,
                        ...finishedDates
                    ];

            }
            else if(
                sortType === "exam-desc"
            ){

                const finishedDates =
                    parsedExamDates.filter(
                        function(item){

                            return (
                                item.daysUntil !== null &&
                                item.daysUntil < 0
                            );

                        }
                    );


                examDisplayList =
                    [
                        ...farthestDateList,
                        ...finishedDates
                    ];

            }
            else{

                /*
                 * ID順・回数順などでは
                 * 元のB → C → Dを維持
                 */

                examDisplayList =
                    [...parsedExamDates];

            }


            /*
             * ====================================
             * 試験日の状態
             * ====================================
             *
             * 0 = 未終了試験日あり
             * 1 = 全て終了
             * 2 = 試験日なし
             */

            let examStatus;


            if(
                unfinishedDates.length > 0
            ){

                examStatus = 0;

            }
            else if(
                parsedExamDates.length > 0
            ){

                examStatus = 1;

            }
            else{

                examStatus = 2;

            }


            /*
             * ====================================
             * 生徒データ保存
             * ====================================
             */

            students.push({

                id:
                    studentId,

                name:
                    displayName,

                count:
                    summaryData[studentName],

                examDates:
                    parsedExamDates,

                nearestDateList:
                    nearestDateList,

                farthestDateList:
                    farthestDateList,

                examStatus:
                    examStatus

            });

        }


        /*
         * 表示
         */

        renderSummary();


        /*
         * 更新時間
         */

        document.getElementById(
            "updateTime"
        ).textContent =
            "最終更新：" +
            new Date().toLocaleString(
                "ja-JP"
            );


    }
    catch(error){

        console.error(error);


        document.getElementById(
            "updateTime"
        ).textContent =
            "データの取得に失敗しました。";

    }

}


/* ========================================
   表示
======================================== */

function renderSummary(){

    const sortType =
        document.getElementById(
            "sortSelect"
        ).value;


    /*
     * 元データをコピー
     */

    const sortedStudents =
        [...students];


    /* ========================================
       ID 昇順
    ======================================== */

    if(
        sortType === "id-asc"
    ){

        sortedStudents.sort(
            function(a,b){

                return compareId(
                    a.id,
                    b.id
                );

            }
        );

    }


    /* ========================================
       ID 降順
    ======================================== */

    else if(
        sortType === "id-desc"
    ){

        sortedStudents.sort(
            function(a,b){

                return compareId(
                    b.id,
                    a.id
                );

            }
        );

    }


    /* ========================================
       回数 多い順
    ======================================== */

    else if(
        sortType === "count-desc"
    ){

        sortedStudents.sort(
            function(a,b){

                if(
                    b.count !== a.count
                ){

                    return (
                        b.count -
                        a.count
                    );

                }


                return compareId(
                    a.id,
                    b.id
                );

            }
        );

    }


    /* ========================================
       回数 少ない順
    ======================================== */

    else if(
        sortType === "count-asc"
    ){

        sortedStudents.sort(
            function(a,b){

                if(
                    a.count !== b.count
                ){

                    return (
                        a.count -
                        b.count
                    );

                }


                return compareId(
                    a.id,
                    b.id
                );

            }
        );

    }


    /* ========================================
       試験日 近い順
    ======================================== */

    else if(
        sortType === "exam-asc"
    ){

        sortedStudents.sort(
            function(a,b){

                /*
                 * 未終了試験日がある人を先
                 */

                if(
                    a.examStatus !==
                    b.examStatus
                ){

                    return (
                        a.examStatus -
                        b.examStatus
                    );

                }


                /*
                 * 両方とも未終了試験日あり
                 */

                if(
                    a.examStatus === 0 &&
                    b.examStatus === 0
                ){

                    const result =
                        compareDateListsAsc(
                            a.nearestDateList,
                            b.nearestDateList
                        );


                    if(
                        result !== 0
                    ){

                        return result;

                    }

                }


                /*
                 * 同じならID順
                 */

                return compareId(
                    a.id,
                    b.id
                );

            }
        );

    }


    /* ========================================
       試験日 遠い順
    ======================================== */

    else if(
        sortType === "exam-desc"
    ){

        sortedStudents.sort(
            function(a,b){

                /*
                 * 未終了試験日がある人を先
                 */

                if(
                    a.examStatus !==
                    b.examStatus
                ){

                    return (
                        a.examStatus -
                        b.examStatus
                    );

                }


                /*
                 * 両方とも未終了試験日あり
                 */

                if(
                    a.examStatus === 0 &&
                    b.examStatus === 0
                ){

                    const result =
                        compareDateListsDesc(
                            a.farthestDateList,
                            b.farthestDateList
                        );


                    if(
                        result !== 0
                    ){

                        return result;

                    }

                }


                /*
                 * 同じならID順
                 */

                return compareId(
                    a.id,
                    b.id
                );

            }
        );

    }


    /* ========================================
       テーブル表示
    ======================================== */

    const tbody =
        document.getElementById(
            "summaryBody"
        );


    tbody.innerHTML = "";


    sortedStudents.forEach(
        function(student){

            const tr =
                document.createElement(
                    "tr"
                );


            /* ====================================
               試験日
            ==================================== */

            const examTd =
                document.createElement(
                    "td"
                );


            examTd.className =
                "exam-date-cell";


            /*
             * 現在の並び替えに合わせて
             * 表示する試験日を決める
             */

            let displayExamDates;


            if(
                sortType === "exam-asc"
            ){

                /*
                 * 近い順
                 */

                const finishedDates =
                    student.examDates.filter(
                        function(item){

                            return (
                                item.daysUntil !== null &&
                                item.daysUntil < 0
                            );

                        }
                    );


                displayExamDates =
                    [
                        ...student.nearestDateList,
                        ...finishedDates
                    ];

            }
            else if(
                sortType === "exam-desc"
            ){

                /*
                 * 遠い順
                 */

                const finishedDates =
                    student.examDates.filter(
                        function(item){

                            return (
                                item.daysUntil !== null &&
                                item.daysUntil < 0
                            );

                        }
                    );


                displayExamDates =
                    [
                        ...student.farthestDateList,
                        ...finishedDates
                    ];

            }
            else{

                /*
                 * その他はB → C → D
                 */

                displayExamDates =
                    [...student.examDates];

            }


            /*
             * 試験日がない
             */

            if(
                displayExamDates.length === 0
            ){

                examTd.textContent =
                    "未設定";

            }
            else{

                displayExamDates.forEach(
                    function(exam){

                        const div =
                            document.createElement(
                                "div"
                            );


                        /*
                         * 過去の試験日
                         */

                        if(
                            exam.daysUntil !== null &&
                            exam.daysUntil < 0
                        ){

                            div.className =
                                "exam-finished";

                            div.textContent =
                                exam.text +
                                " ✅";

                        }
                        else{

                            /*
                             * 今日・未来
                             */

                            div.className =
                                "exam-active";

                            div.textContent =
                                exam.text;

                        }


                        examTd.appendChild(
                            div
                        );

                    }
                );

            }


            /* ====================================
               生徒名 / ID
            ==================================== */

            const nameTd =
                document.createElement(
                    "td"
                );


            nameTd.className =
                "student-cell";


            const studentLink =
                document.createElement(
                    "span"
                );


            studentLink.className =
                "student-link";


            studentLink.textContent =
                student.name +
                " " +
                student.id;


            studentLink.onclick =
                function(){

                    showHistory(
                        student.id,
                        student.name +
                        " " +
                        student.id
                    );

                };


            nameTd.appendChild(
                studentLink
            );


            /* ====================================
               面接回数
            ==================================== */

            const countTd =
                document.createElement(
                    "td"
                );


            countTd.className =
                "count-cell";


            countTd.textContent =
                student.count +
                "回";


            /* ====================================
               行追加
            ==================================== */

            tr.appendChild(
                examTd
            );

            tr.appendChild(
                nameTd
            );

            tr.appendChild(
                countTd
            );


            tbody.appendChild(
                tr
            );

        }
    );

}


/* ========================================
   試験日の比較
   近い順
======================================== */

function compareDateListsAsc(
    listA,
    listB
){

    const length =
        Math.min(
            listA.length,
            listB.length
        );


    /*
     * 1番目 → 2番目 → 3番目
     * の順に比較
     */

    for(
        let i = 0;
        i < length;
        i++
    ){

        if(
            listA[i].daysUntil !==
            listB[i].daysUntil
        ){

            /*
             * 小さい方が近い
             */

            return (
                listA[i].daysUntil -
                listB[i].daysUntil
            );

        }

    }


    /*
     * 全て同じなら
     * 試験日が多い方を先
     */

    if(
        listA.length !==
        listB.length
    ){

        return (
            listB.length -
            listA.length
        );

    }


    return 0;

}


/* ========================================
   試験日の比較
   遠い順
======================================== */

function compareDateListsDesc(
    listA,
    listB
){

    const length =
        Math.min(
            listA.length,
            listB.length
        );


    /*
     * 1番遠い日
     * ↓
     * 2番目に遠い日
     * ↓
     * 3番目に遠い日
     *
     * の順で比較
     */

    for(
        let i = 0;
        i < length;
        i++
    ){

        if(
            listA[i].daysUntil !==
            listB[i].daysUntil
        ){

            /*
             * 大きい方が遠い
             */

            return (
                listB[i].daysUntil -
                listA[i].daysUntil
            );

        }

    }


    /*
     * 全て同じなら
     * 試験日が多い方を先
     */

    if(
        listA.length !==
        listB.length
    ){

        return (
            listB.length -
            listA.length
        );

    }


    return 0;

}


/* ========================================
   ID比較
======================================== */

function compareId(a,b){

    return a.localeCompare(
        b,
        undefined,
        {
            numeric:true,
            sensitivity:"base"
        }
    );

}


/* ========================================
   面接履歴
======================================== */

async function showHistory(
    studentId,
    studentName
){

    const historyArea =
        document.getElementById(
            "historyArea"
        );


    historyArea.innerHTML =
        "読み込み中...";


    try{

        const response =
            await fetch(
                GAS_URL +
                "?mode=history&id=" +
                encodeURIComponent(
                    studentId
                )
            );


        const history =
            await response.json();


        let html =
            "<h2>" +
            studentName +
            " の面接履歴" +
            "</h2>";


        if(
            history.length === 0
        ){

            html +=
                "<p>面接履歴はありません。</p>";

        }
        else{

            html +=
                "<table>";

            html +=
                "<thead>";

            html +=
                "<tr>";

            html +=
                "<th>回数</th>";

            html +=
                "<th>日時</th>";

            html +=
                "<th>担当先生</th>";

            html +=
                "</tr>";

            html +=
                "</thead>";

            html +=
                "<tbody>";


            history.forEach(
                function(item,index){

                    const date =
                        new Date(
                            item.date
                        );


                    html +=
                        "<tr>";

                    html +=
                        "<td>" +
                        (index + 1) +
                        "回目" +
                        "</td>";

                    html +=
                        "<td>" +
                        date.toLocaleString(
                            "ja-JP"
                        ) +
                        "</td>";

                    html +=
                        "<td>" +
                        item.teacher +
                        "</td>";

                    html +=
                        "</tr>";

                }
            );


            html +=
                "</tbody>";

            html +=
                "</table>";

        }


        historyArea.innerHTML =
            html;

    }
    catch(error){

        console.error(error);


        historyArea.innerHTML =
            "履歴の取得に失敗しました。";

    }

}


/* ========================================
   更新
======================================== */

function refreshData(){

    loadSummary();

}

</script>


</body>

</html>
