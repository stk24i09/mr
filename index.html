<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>面接練習回数管理システム</title>

<style>

/* ========================================
   ページ全体
======================================== */

body{
    font-family:sans-serif;
    margin:30px;
    max-width:1400px;
}


/* ========================================
   ページタイトル
======================================== */

.page-title{
    text-align:center;
    margin-bottom:30px;
}


/* ========================================
   左右の画面
======================================== */

.container{
    display:flex;
    flex-direction:row;
    align-items:flex-start;
    gap:30px;
}

.left-panel{
    flex:1;
    min-width:400px;
}

.right-panel{
    flex:1;
    min-width:400px;
}


/* ========================================
   テーブル
======================================== */

table{
    border-collapse:collapse;
    width:100%;
}

th,td{
    border:1px solid #000;
    padding:10px;
    text-align:center;
}

th{
    background:#eeeeee;
}


/* ========================================
   生徒リンク
======================================== */

.student-link{
    color:blue;
    cursor:pointer;
    text-decoration:underline;
}

.student-link:hover{
    color:red;
}


/* ========================================
   面接履歴
======================================== */

#historyArea{
    border:1px solid #ccc;
    padding:15px;
    min-height:300px;
    background:#fafafa;
}


/* ========================================
   並び替え
======================================== */

.sortArea{
    margin-bottom:15px;
}

select{
    padding:5px;
    font-size:16px;
}

button{
    padding:6px 15px;
    font-size:16px;
    margin-left:15px;
    cursor:pointer;
}

button:hover{
    background:#eeeeee;
}


/* ========================================
   更新時間
======================================== */

#updateTime{
    margin-top:10px;
    color:#555;
}


/* ========================================
   試験日前
======================================== */

.exam-active{
    font-weight:bold;
}


/* ========================================
   試験日経過後
   ※通常の文字にする
======================================== */

.exam-finished{
    font-weight:normal;
}

</style>

</head>


<body>


<!-- =====================================
     ページタイトル
===================================== -->

<h1 class="page-title">
    面接練習回数一覧
</h1>



<!-- =====================================
     左右の画面
===================================== -->

<div class="container">



    <!-- =================================
         左側
    ================================== -->

    <div class="left-panel">



        <!-- =================================
             並び替え・更新
        ================================== -->

        <div class="sortArea">

            <label for="sortSelect">
                並び替え：
            </label>


            <select
                id="sortSelect"
                onchange="renderSummary()"
            >

                <option value="id-asc">
                    生徒ID順（昇順）
                </option>

                <option value="id-desc">
                    生徒ID順（降順）
                </option>

                <option value="count-desc">
                    回数順（昇順）
                </option>

                <option value="count-asc">
                    回数順（降順）
                </option>

                <option value="exam-asc">
                    試験日順（近い順）
                </option>

                <option value="exam-desc">
                    試験日順（遠い順）
                </option>

            </select>


            <button onclick="refreshData()">
                🔄 更新
            </button>


            <p id="updateTime"></p>

        </div>



        <!-- =================================
             生徒一覧
        ================================== -->

        <table id="summaryTable">

            <tr>

                <th>
                    試験日
                </th>

                <th>
                    生徒名 / ID
                </th>

                <th>
                    面接回数
                </th>

            </tr>

        </table>



    </div>



    <!-- =================================
         右側
    ================================== -->

    <div class="right-panel">


        <div id="historyArea">

            <h2>
                面接履歴
            </h2>

            <p>
                生徒IDをクリックしてください。
            </p>

        </div>


    </div>



</div>



<script>


// ========================================
// GAS API
// ========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxYvNAx8TWTezWFp9V7G2UeXYkHGehDVWDdweIhdAnLaeqfzRhbpU8CONMt7CV45tj4/exec";



// ========================================
// 生徒データを保存
// ========================================

let students = [];



// ========================================
// ページを開いたときに読み込む
// ========================================

loadSummary();



// ========================================
// 更新ボタン
// ========================================

function refreshData(){

    loadSummary();

    let now = new Date();

    document.getElementById(
        "updateTime"
    ).innerHTML =
        "最終更新：" +
        now.toLocaleString("ja-JP");

}



// ========================================
// 今日の日付を取得
// ========================================

function getToday(){

    const today = new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );

    return today;

}



// ========================================
// 試験日をDate型に変換
// ========================================

function getExamDate(dateText){

    if(
        !dateText ||
        dateText === "未設定"
    ){

        return null;

    }


    const parts =
        dateText.split("/");


    if(parts.length !== 3){

        return null;

    }


    const year =
        Number(parts[0]);

    const month =
        Number(parts[1]);

    const day =
        Number(parts[2]);


    if(
        isNaN(year) ||
        isNaN(month) ||
        isNaN(day)
    ){

        return null;

    }


    const date =
        new Date(
            year,
            month - 1,
            day
        );


    date.setHours(
        0,
        0,
        0,
        0
    );


    return date;

}



// ========================================
// 試験日が過ぎているか
// ========================================

function isExamFinished(dateText){

    const examDate =
        getExamDate(dateText);


    if(examDate === null){

        return false;

    }


    const today =
        getToday();


    return (
        examDate.getTime()
        <
        today.getTime()
    );

}



// ========================================
// 今日から何日離れているか
// ========================================

function getDaysUntilExam(dateText){

    const examDate =
        getExamDate(dateText);


    if(examDate === null){

        return null;

    }


    const today =
        getToday();


    const oneDay =
        1000 *
        60 *
        60 *
        24;


    return Math.round(
        (
            examDate.getTime()
            -
            today.getTime()
        )
        /
        oneDay
    );

}



// ========================================
// 生徒ID比較
// ========================================

function compareStudentId(a,b){

    return a.id.localeCompare(
        b.id,
        undefined,
        {
            numeric:true
        }
    );

}



// ========================================
// GASからデータを取得
// ========================================

function loadSummary(){

    Promise.all([

        fetch(
            API_URL + "?mode=summary"
        )
        .then(
            response =>
                response.json()
        ),

        fetch(
            API_URL + "?mode=examDates"
        )
        .then(
            response =>
                response.json()
        )

    ])


    .then(function(results){


        // ==================================
        // 面接回数
        // ==================================

        const data =
            results[0];


        // ==================================
        // 試験日
        // ==================================

        const examDates =
            results[1];



        // ==================================
        // 生徒データを作成
        // ==================================

        students = [];


        for(
            let name in data
        ){


            // =================================
            // 生徒IDを取得
            // =================================

            const idMatch =
                name.match(
                    /\d+[a-zA-Z]\d+/
                );


            const studentId =
                idMatch
                    ? idMatch[0]
                    : name;



            // =================================
            // 試験日
            // =================================

            const examDate =
                examDates[studentId] || "";



            students.push({

                name:name,

                id:studentId,

                count:
                    Number(
                        data[name]
                    ) || 0,

                examDate:
                    examDate,

                finished:
                    isExamFinished(
                        examDate
                    ),

                daysUntil:
                    getDaysUntilExam(
                        examDate
                    )

            });

        }



        // ==================================
        // 一覧を表示
        // ==================================

        renderSummary();


    })


    .catch(function(error){

        console.error(
            "エラーが発生しました:",
            error
        );

    });

}



// ========================================
// 並び替え＋一覧表示
// ========================================

function renderSummary(){


    // ====================================
    // 現在選択されている並び替え
    // ====================================

    const sortType =
        document.getElementById(
            "sortSelect"
        ).value;



    // ====================================
    // 生徒ID 昇順
    // ====================================

    if(
        sortType === "id-asc"
    ){

        students.sort(
            function(a,b){

                return compareStudentId(
                    a,
                    b
                );

            }
        );

    }



    // ====================================
    // 生徒ID 降順
    // ====================================

    else if(
        sortType === "id-desc"
    ){

        students.sort(
            function(a,b){

                return compareStudentId(
                    b,
                    a
                );

            }
        );

    }



    // ====================================
    // 回数 多い順
    // ====================================

    else if(
        sortType === "count-desc"
    ){

        students.sort(
            function(a,b){

                if(
                    a.count !==
                    b.count
                ){

                    return (
                        b.count -
                        a.count
                    );

                }


                return compareStudentId(
                    a,
                    b
                );

            }
        );

    }



    // ====================================
    // 回数 少ない順
    // ====================================

    else if(
        sortType === "count-asc"
    ){

        students.sort(
            function(a,b){

                if(
                    a.count !==
                    b.count
                ){

                    return (
                        a.count -
                        b.count
                    );

                }


                return compareStudentId(
                    a,
                    b
                );

            }
        );

    }



    // ====================================
    // 試験日 近い順
    // ====================================

    else if(
        sortType === "exam-asc"
    ){

        students.sort(
            function(a,b){


                // -------------------------
                // 未設定
                // -------------------------

                if(
                    a.daysUntil === null &&
                    b.daysUntil === null
                ){

                    return compareStudentId(
                        a,
                        b
                    );

                }


                if(
                    a.daysUntil === null
                ){

                    return 1;

                }


                if(
                    b.daysUntil === null
                ){

                    return -1;

                }



                // -------------------------
                // 試験日前同士
                // -------------------------

                if(
                    !a.finished &&
                    !b.finished
                ){

                    if(
                        a.daysUntil !==
                        b.daysUntil
                    ){

                        return (
                            a.daysUntil -
                            b.daysUntil
                        );

                    }


                    return compareStudentId(
                        a,
                        b
                    );

                }



                // -------------------------
                // 試験日前を上
                // -------------------------

                if(
                    !a.finished &&
                    b.finished
                ){

                    return -1;

                }


                if(
                    a.finished &&
                    !b.finished
                ){

                    return 1;

                }



                // -------------------------
                // 試験日経過同士
                // -------------------------

                if(
                    a.daysUntil !==
                    b.daysUntil
                ){

                    return (
                        b.daysUntil -
                        a.daysUntil
                    );

                }


                return compareStudentId(
                    a,
                    b
                );

            }
        );

    }



    // ====================================
    // 試験日 遠い順
    // ====================================

    else if(
        sortType === "exam-desc"
    ){

        students.sort(
            function(a,b){


                // -------------------------
                // 未設定
                // -------------------------

                if(
                    a.daysUntil === null &&
                    b.daysUntil === null
                ){

                    return compareStudentId(
                        a,
                        b
                    );

                }


                if(
                    a.daysUntil === null
                ){

                    return 1;

                }


                if(
                    b.daysUntil === null
                ){

                    return -1;

                }



                // -------------------------
                // 試験日前同士
                // -------------------------

                if(
                    !a.finished &&
                    !b.finished
                ){

                    if(
                        a.daysUntil !==
                        b.daysUntil
                    ){

                        return (
                            b.daysUntil -
                            a.daysUntil
                        );

                    }


                    return compareStudentId(
                        a,
                        b
                    );

                }



                // -------------------------
                // 試験日前を上
                // -------------------------

                if(
                    !a.finished &&
                    b.finished
                ){

                    return -1;

                }


                if(
                    a.finished &&
                    !b.finished
                ){

                    return 1;

                }



                // -------------------------
                // 試験日経過同士
                // -------------------------

                if(
                    a.daysUntil !==
                    b.daysUntil
                ){

                    return (
                        b.daysUntil -
                        a.daysUntil
                    );

                }


                return compareStudentId(
                    a,
                    b
                );

            }
        );

    }



    // ====================================
    // 表のヘッダー
    // ====================================

    let html = `

        <tr>

            <th>
                試験日
            </th>

            <th>
                生徒名 / ID
            </th>

            <th>
                面接回数
            </th>

        </tr>

    `;



    // ====================================
    // 生徒一覧
    // ====================================

    students.forEach(
        function(student){


            // ==================================
            // 試験日
            // ==================================

            let examDateText =
                student.examDate !== ""
                    ? student.examDate
                    : "未設定";



            // ==================================
            // 試験日前・当日の場合
            // 太字
            // ==================================

            if(
                student.examDate !== "" &&
                !student.finished
            ){

                examDateText = `

                    <span class="exam-active">
                        ${student.examDate}
                    </span>

                `;

            }



            // ==================================
            // 試験日が過ぎた場合
            // 通常文字 ＋ ✅
            // ==================================

            if(
                student.examDate !== "" &&
                student.finished
            ){

                examDateText = `

                    <span class="exam-finished">
                        ${student.examDate} ✅
                    </span>

                `;

            }



            // ==================================
            // 生徒名＋ID
            // 全体をクリック可能にする
            // ==================================

            html += `

                <tr>


                    <!-- =========================
                         試験日
                    ========================== -->

                    <td>

                        ${examDateText}

                    </td>



                    <!-- =========================
                         生徒名 / ID
                    ========================== -->

                    <td>

                        <span
                            class="student-link"
                            onclick="showHistory(
                                '${student.id}',
                                '${student.name}'
                            )"
                        >

                            ${student.name}

                        </span>

                    </td>



                    <!-- =========================
                         面接回数
                    ========================== -->

                    <td>

                        ${student.count}回

                    </td>


                </tr>

            `;

        }
    );



    // ====================================
    // 画面へ反映
    // ====================================

    document.getElementById(
        "summaryTable"
    ).innerHTML = html;

}



// ========================================
// 面接履歴表示
// ========================================

function showHistory(
    studentId,
    studentName
){


    // =====================================
    // まず読み込み中を表示
    // =====================================

    document.getElementById(
        "historyArea"
    ).innerHTML = `

        <h2>
            面接履歴
        </h2>

        <p>
            ${studentName} の面接履歴を読み込み中...
        </p>

    `;



    // =====================================
    // IDを使って履歴を取得
    // =====================================

    fetch(

        API_URL +
        "?mode=history&id=" +
        encodeURIComponent(
            studentId
        )

    )


    .then(
        response =>
            response.json()
    )


    .then(function(data){


        // ==================================
        // 履歴画面
        // ==================================

        let html = `

        <h2>
            ${studentName} の面接履歴
        </h2>



        <table>

        <tr>

            <th>
                回数
            </th>

            <th>
                日時
            </th>

            <th>
                担当先生
            </th>

        </tr>

        `;



        // ==================================
        // 履歴がない場合
        // ==================================

        if(
            !data ||
            data.length === 0
        ){

            html += `

            <tr>

                <td colspan="3">

                    まだ面接練習の記録はありません。

                </td>

            </tr>

            `;

        }



        // ==================================
        // 履歴がある場合
        // ==================================

        else{

            for(
                let i = 0;
                i < data.length;
                i++
            ){

                let date =
                    new Date(
                        data[i].date
                    );


                html += `

                <tr>

                    <td>
                        ${i + 1}回目
                    </td>

                    <td>
                        ${date.toLocaleString(
                            "ja-JP"
                        )}
                    </td>

                    <td>
                        ${data[i].teacher}
                    </td>

                </tr>

                `;

            }

        }



        html += "</table>";



        // ==================================
        // 右側へ表示
        // ==================================

        document.getElementById(
            "historyArea"
        ).innerHTML = html;


    })


    .catch(function(error){

        console.error(
            "履歴取得エラー:",
            error
        );


        document.getElementById(
            "historyArea"
        ).innerHTML = `

            <h2>
                面接履歴
            </h2>

            <p>
                面接履歴の取得に失敗しました。
            </p>

        `;

    });

}

</script>


</body>

</html>
