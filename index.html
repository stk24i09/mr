<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>面接練習回数管理システム</title>

<style>

body{
    font-family:sans-serif;
    margin:30px;
    max-width:1400px;
}


/* ========================================
   左右の画面
======================================== */

.container{
    display:flex;
    flex-direction:row;
    align-items:flex-start;
    gap:30px;
}

.left-panel{
    flex:1;
    min-width:400px;
}

.right-panel{
    flex:1;
    min-width:400px;
}


/* ========================================
   テーブル
======================================== */

table{
    border-collapse:collapse;
    width:100%;
}

th,td{
    border:1px solid #000;
    padding:10px;
    text-align:center;
}

th{
    background:#eeeeee;
}


/* ========================================
   生徒リンク
======================================== */

.student-link{
    color:blue;
    cursor:pointer;
    text-decoration:underline;
}

.student-link:hover{
    color:red;
}


/* ========================================
   面接履歴
======================================== */

#historyArea{
    border:1px solid #ccc;
    padding:15px;
    min-height:300px;
    background:#fafafa;
}


/* ========================================
   並び替え
======================================== */

.sortArea{
    margin-bottom:15px;
}

select{
    padding:5px;
    font-size:16px;
}

button{
    padding:6px 15px;
    font-size:16px;
    margin-left:15px;
    cursor:pointer;
}

button:hover{
    background:#eeeeee;
}


/* ========================================
   更新時間
======================================== */

#updateTime{
    margin-top:10px;
    color:#555;
}

</style>

</head>


<body>


<div class="container">


<!-- =====================================
     左側
===================================== -->

<div class="left-panel">

<h1>面接練習回数一覧</h1>


<div class="sortArea">

<label for="sortSelect">
    並び替え：
</label>


<select id="sortSelect" onchange="loadSummary()">

    <option value="id">
        生徒ID順
    </option>

    <option value="count">
        面接回数順
    </option>

</select>


<button onclick="refreshData()">
    🔄 更新
</button>


<p id="updateTime"></p>

</div>



<!-- =====================================
     一覧表
===================================== -->

<table id="summaryTable">

<tr>

    <th>試験日</th>

    <th>生徒名 / ID</th>

    <th>面接回数</th>

</tr>

</table>


</div>



<!-- =====================================
     右側
===================================== -->

<div class="right-panel">

<div id="historyArea">

    <h2>面接履歴</h2>

    <p>
        生徒名をクリックしてください。
    </p>

</div>

</div>


</div>



<script>


// ========================================
// GAS API
// ========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxYvNAx8TWTezWFp9V7G2UeXYkHGehDVWDdweIhdAnLaeqfzRhbpU8CONMt7CV45tj4/exec";


// ========================================
// 最初に読み込む
// ========================================

loadSummary();


// ========================================
// 更新ボタン
// ========================================

function refreshData(){

    loadSummary();

    let now = new Date();

    document.getElementById("updateTime").innerHTML =
        "最終更新：" +
        now.toLocaleString("ja-JP");
}


// ========================================
// 一覧読み込み
// ========================================

function loadSummary(){

    // 面接回数と試験日を同時取得
    Promise.all([

        fetch(API_URL + "?mode=summary")
            .then(response => response.json()),

        fetch(API_URL + "?mode=examDates")
            .then(response => response.json())

    ])

    .then(function(results){

        const data = results[0];

        const examDates = results[1];


        // ==================================
        // 表のヘッダー
        // ==================================

        let html = `

        <tr>

            <th>試験日</th>

            <th>生徒名 / ID</th>

            <th>面接回数</th>

        </tr>

        `;


        // ==================================
        // 生徒データ作成
        // ==================================

        let students = [];


        for(let name in data){

            // 生徒IDを取得
            const idMatch =
                name.match(/\d+[a-zA-Z]\d+/);

            const studentId =
                idMatch
                    ? idMatch[0]
                    : name;


            students.push({

                name: name,

                id: studentId,

                count: Number(data[name]) || 0,

                examDate:
                    examDates[studentId] || ""

            });

        }


        // ==================================
        // 並び替え
        // ==================================

        const sortType =
            document.getElementById("sortSelect").value;


        // ==================================
        // 面接回数順
        // ==================================

        if(sortType == "count"){

            students.sort(function(a,b){

                // まず面接回数
                if(b.count !== a.count){

                    return b.count - a.count;

                }

                // 回数が同じなら生徒ID順
                return a.id.localeCompare(
                    b.id,
                    undefined,
                    {
                        numeric:true
                    }
                );

            });

        }


        // ==================================
        // 生徒ID順
        // ==================================

        else{

            students.sort(function(a,b){

                return a.id.localeCompare(
                    b.id,
                    undefined,
                    {
                        numeric:true
                    }
                );

            });

        }


        // ==================================
        // テーブル作成
        // ==================================

        students.forEach(function(student){


            // 試験日
            let examDateText =
                student.examDate !== ""
                    ? student.examDate
                    : "未設定";


            html += `

            <tr>

                <td>
                    ${examDateText}
                </td>


                <td>

                    <span
                        class="student-link"
                        onclick="showHistory('${student.id}')"
                    >

                        ${student.name}

                    </span>

                </td>


                <td>

                    ${student.count}回

                </td>

            </tr>

            `;

        });


        // ==================================
        // 画面へ反映
        // ==================================

        document.getElementById(
            "summaryTable"
        ).innerHTML = html;

    })


    .catch(function(error){

        console.error(
            "エラーが発生しました:",
            error
        );

    });

}



// ========================================
// 面接履歴
// ========================================

function showHistory(studentId){

    fetch(
        API_URL +
        "?mode=history&id=" +
        encodeURIComponent(studentId)
    )

    .then(response => response.json())

    .then(function(data){


        let html = `

        <h2>
            ${studentId} の面接履歴
        </h2>


        <table>

        <tr>

            <th>回数</th>

            <th>日時</th>

            <th>担当先生</th>

        </tr>

        `;


        // ==================================
        // 履歴なし
        // ==================================

        if(!data || data.length === 0){

            html += `

            <tr>

                <td colspan="3">

                    まだ面接練習の記録はありません。

                </td>

            </tr>

            `;

        }


        // ==================================
        // 履歴あり
        // ==================================

        else{

            for(
                let i = 0;
                i < data.length;
                i++
            ){

                let date =
                    new Date(data[i].date);


                html += `

                <tr>

                    <td>
                        ${i + 1}回目
                    </td>


                    <td>
                        ${date.toLocaleString("ja-JP")}
                    </td>


                    <td>
                        ${data[i].teacher}
                    </td>

                </tr>

                `;

            }

        }


        html += "</table>";


        document.getElementById(
            "historyArea"
        ).innerHTML = html;

    })


    .catch(function(error){

        console.error(
            "履歴取得エラー:",
            error
        );

    });

}

</script>


</body>

</html>
