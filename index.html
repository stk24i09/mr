<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>面接練習回数一覧</title>

<style>

body{
    font-family:sans-serif;
    margin:30px;
    max-width:1400px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}


/* ========================================
   左右の画面
======================================== */

.container{
    display:flex;
    gap:30px;
}

.left{
    flex:1;
    min-width:400px;
}

.right{
    flex:1;
    min-width:400px;
}


/* ========================================
   並び替え
======================================== */

.sortArea{
    margin-bottom:15px;
}

select{
    padding:5px;
    font-size:16px;
}

button{
    padding:6px 15px;
    font-size:16px;
    margin-left:15px;
}


/* ========================================
   テーブル
======================================== */

table{
    border-collapse:collapse;
    width:100%;
}

th,
td{
    border:1px solid #000;
    padding:10px;
}

th{
    background:#f2f2f2;
}


/* ========================================
   生徒リンク
======================================== */

.student-link{
    color:blue;
    cursor:pointer;
    text-decoration:underline;
}

.student-link:hover{
    color:red;
}


/* ========================================
   試験日
======================================== */

.exam-date-list{
    line-height:1.8;
}

.exam-active{
    font-weight:bold;
}

.exam-finished{
    font-weight:normal;
}


/* ========================================
   更新時間
======================================== */

#updateTime{
    margin-top:10px;
    color:#555;
}


/* ========================================
   履歴
======================================== */

#historyArea{
    border:1px solid #ccc;
    padding:15px;
    min-height:300px;
    background:#fafafa;
}

#historyArea h2{
    margin-top:0;
}

</style>

</head>


<body>


<h1>面接練習回数一覧</h1>


<div class="container">


<!-- ========================================
     左側
======================================== -->

<div class="left">

    <div class="sortArea">

        <select id="sortSelect">

            <option value="id-asc">
                生徒ID順（昇順）
            </option>

            <option value="id-desc">
                生徒ID順（降順）
            </option>

            <option value="count-desc">
                回数順（多）
            </option>

            <option value="count-asc">
                回数順（少）
            </option>

            <option value="exam-asc">
                試験日順（近い順）
            </option>

            <option value="exam-desc">
                試験日順（遠い順）
            </option>

        </select>


        <button onclick="refreshData()">
            🔄 更新
        </button>

    </div>


    <table>

        <thead>

            <tr>

                <th>
                    試験日
                </th>

                <th>
                    生徒名 / ID
                </th>

                <th>
                    面接回数
                </th>

            </tr>

        </thead>


        <tbody id="summaryBody">

        </tbody>

    </table>


    <div id="updateTime">
        更新中...
    </div>

</div>



<!-- ========================================
     右側
======================================== -->

<div class="right">

    <h2>
        面接履歴
    </h2>


    <div id="historyArea">

        生徒IDをクリックしてください。

    </div>

</div>


</div>


<script>


/* ========================================
   GAS URL
======================================== */

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxYvNAx8TWTezWFp9V7G2UeXYkHGehDVWDdweIhdAnLaeqfzRhbpU8CONMt7CV45tj4/exec";


/* ========================================
   データ保存
======================================== */

let students = [];


/* ========================================
   ページ読み込み
======================================== */

window.onload = function(){

    loadSummary();

    document
        .getElementById("sortSelect")
        .addEventListener("change", function(){

            renderSummary();

        });

};


/* ========================================
   データ取得
======================================== */

async function loadSummary(){

    try{

        const summaryResponse =
            await fetch(
                GAS_URL + "?mode=summary"
            );

        const summaryData =
            await summaryResponse.json();


        const examResponse =
            await fetch(
                GAS_URL + "?mode=examDates"
            );

        const examData =
            await examResponse.json();


        students = [];


        for(const studentName in summaryData){

            const match =
                studentName.match(/\d+[a-zA-Z]\d+/);


            if(!match){
                continue;
            }


            const studentId =
                match[0];


            /*
             * 生徒名
             *
             * 例：
             * 池田 宗真24i03
             *
             * ↓
             *
             * 池田 宗真
             */

            let displayName =
                studentName
                    .replace(studentId, "")
                    .trim();


            /*
             * 試験日一覧
             */

            const examList =
                examData[studentId] || [];


            /*
             * 今日の日付を取得
             *
             * 時刻は0:00にする
             */

            const today =
                new Date();

            today.setHours(
                0,
                0,
                0,
                0
            );


            /*
             * 試験日を解析
             */

            const parsedExamDates =
                examList.map(function(dateText){

                    const parts =
                        String(dateText).split("/");


                    if(parts.length !== 3){

                        return {
                            text: dateText,
                            date: null,
                            daysUntil: null
                        };

                    }


                    const year =
                        Number(parts[0]);

                    const month =
                        Number(parts[1]);

                    const day =
                        Number(parts[2]);


                    const examDate =
                        new Date(
                            year,
                            month - 1,
                            day
                        );


                    examDate.setHours(
                        0,
                        0,
                        0,
                        0
                    );


                    const diff =
                        examDate - today;


                    const daysUntil =
                        Math.floor(
                            diff /
                            (1000 * 60 * 60 * 24)
                        );


                    return {

                        text:
                            year +
                            "/" +
                            String(month).padStart(2, "0") +
                            "/" +
                            String(day).padStart(2, "0"),

                        date:
                            examDate,

                        daysUntil:
                            daysUntil

                    };

                });


            /*
             * ========================================
             * ここが今回の重要部分
             * ========================================
             *
             * 今日以降の試験日だけを抽出
             *
             * 過去の日付はここで除外する
             */

            const futureExamDates =
                parsedExamDates.filter(function(item){

                    return (
                        item.daysUntil !== null &&
                        item.daysUntil >= 0
                    );

                });


            /*
             * 今日以降の試験日の中で
             *
             * 一番近い日
             */

            let nearestFutureDays =
                null;


            if(futureExamDates.length > 0){

                nearestFutureDays =
                    Math.min(
                        ...futureExamDates.map(
                            item => item.daysUntil
                        )
                    );

            }


            /*
             * 今日以降の試験日の中で
             *
             * 一番遠い日
             */

            let farthestFutureDays =
                null;


            if(futureExamDates.length > 0){

                farthestFutureDays =
                    Math.max(
                        ...futureExamDates.map(
                            item => item.daysUntil
                        )
                    );

            }


            /*
             * 試験日の状態
             *
             * 0 = 今日以降の試験日あり
             * 1 = 試験日はあるが全て終了
             * 2 = 試験日なし
             */

            let examStatus;


            if(futureExamDates.length > 0){

                examStatus = 0;

            }
            else if(parsedExamDates.length > 0){

                examStatus = 1;

            }
            else{

                examStatus = 2;

            }


            students.push({

                id:
                    studentId,

                name:
                    displayName,

                count:
                    summaryData[studentName],

                examDates:
                    parsedExamDates,

                nearestFutureDays:
                    nearestFutureDays,

                farthestFutureDays:
                    farthestFutureDays,

                examStatus:
                    examStatus

            });

        }


        renderSummary();


        document.getElementById(
            "updateTime"
        ).textContent =
            "最終更新：" +
            new Date().toLocaleString("ja-JP");


    }
    catch(error){

        console.error(error);


        document.getElementById(
            "updateTime"
        ).textContent =
            "データの取得に失敗しました。";

    }

}


/* ========================================
   表示
======================================== */

function renderSummary(){

    const sortType =
        document.getElementById(
            "sortSelect"
        ).value;


    /*
     * 元データを直接変更しない
     */

    const sortedStudents =
        [...students];


    /* ========================================
       生徒ID 昇順
    ======================================== */

    if(sortType === "id-asc"){

        sortedStudents.sort(function(a,b){

            return compareId(
                a.id,
                b.id
            );

        });

    }


    /* ========================================
       生徒ID 降順
    ======================================== */

    else if(sortType === "id-desc"){

        sortedStudents.sort(function(a,b){

            return compareId(
                b.id,
                a.id
            );

        });

    }


    /* ========================================
       回数 多い順
    ======================================== */

    else if(sortType === "count-desc"){

        sortedStudents.sort(function(a,b){

            if(b.count !== a.count){

                return b.count - a.count;

            }


            return compareId(
                a.id,
                b.id
            );

        });

    }


    /* ========================================
       回数 少ない順
    ======================================== */

    else if(sortType === "count-asc"){

        sortedStudents.sort(function(a,b){

            if(a.count !== b.count){

                return a.count - b.count;

            }


            return compareId(
                a.id,
                b.id
            );

        });

    }


    /* ========================================
       試験日 近い順
    ======================================== */

    else if(sortType === "exam-asc"){

        sortedStudents.sort(function(a,b){

            /*
             * まず
             *
             * 今日以降の試験日があるか
             *
             * を比較
             */

            if(a.examStatus !== b.examStatus){

                return (
                    a.examStatus -
                    b.examStatus
                );

            }


            /*
             * 両方とも今日以降の試験日あり
             */

            if(a.examStatus === 0){

                if(
                    a.nearestFutureDays !==
                    b.nearestFutureDays
                ){

                    return (
                        a.nearestFutureDays -
                        b.nearestFutureDays
                    );

                }

            }


            /*
             * 同じ条件ならID順
             */

            return compareId(
                a.id,
                b.id
            );

        });

    }


    /* ========================================
       試験日 遠い順
    ======================================== */

    else if(sortType === "exam-desc"){

        sortedStudents.sort(function(a,b){

            /*
             * まず
             *
             * 今日以降の試験日があるか
             *
             * を比較
             */

            if(a.examStatus !== b.examStatus){

                return (
                    a.examStatus -
                    b.examStatus
                );

            }


            /*
             * 両方とも今日以降の試験日あり
             */

            if(a.examStatus === 0){

                if(
                    a.farthestFutureDays !==
                    b.farthestFutureDays
                ){

                    return (
                        b.farthestFutureDays -
                        a.farthestFutureDays
                    );

                }

            }


            /*
             * 同じ条件ならID順
             */

            return compareId(
                a.id,
                b.id
            );

        });

    }


    /*
     * テーブルを空にする
     */

    const tbody =
        document.getElementById(
            "summaryBody"
        );


    tbody.innerHTML = "";


    /*
     * 生徒を表示
     */

    sortedStudents.forEach(function(student){

        const tr =
            document.createElement("tr");


        /* ========================================
           試験日
        ======================================== */

        const examTd =
            document.createElement("td");


        examTd.className =
            "exam-date-list";


        if(student.examDates.length === 0){

            examTd.textContent =
                "未設定";

        }
        else{

            student.examDates.forEach(
                function(exam){

                    const div =
                        document.createElement("div");


                    /*
                     * 今日以降なら太字
                     *
                     * 過去なら通常表示 + ✅
                     */

                    if(
                        exam.daysUntil !== null &&
                        exam.daysUntil < 0
                    ){

                        div.className =
                            "exam-finished";

                        div.textContent =
                            exam.text +
                            " ✅";

                    }
                    else{

                        div.className =
                            "exam-active";

                        div.textContent =
                            exam.text;

                    }


                    examTd.appendChild(div);

                }
            );

        }


        /* ========================================
           生徒名 / ID
        ======================================== */

        const nameTd =
            document.createElement("td");


        const studentLink =
            document.createElement("span");


        studentLink.className =
            "student-link";


        studentLink.textContent =
            student.name +
            " " +
            student.id;


        /*
         * クリックしたら履歴を表示
         */

        studentLink.onclick =
            function(){

                showHistory(
                    student.id,
                    student.name +
                    " " +
                    student.id
                );

            };


        nameTd.appendChild(
            studentLink
        );


        /* ========================================
           面接回数
        ======================================== */

        const countTd =
            document.createElement("td");


        countTd.textContent =
            student.count +
            "回";


        /* ========================================
           行を追加
        ======================================== */

        tr.appendChild(
            examTd
        );

        tr.appendChild(
            nameTd
        );

        tr.appendChild(
            countTd
        );


        tbody.appendChild(
            tr
        );

    });

}


/* ========================================
   ID比較
======================================== */

function compareId(a,b){

    /*
     * 24i01
     * 24i02
     * 24i10
     *
     * のようなIDを数字部分も考慮して比較
     */

    return a.localeCompare(
        b,
        undefined,
        {
            numeric:true,
            sensitivity:"base"
        }
    );

}


/* ========================================
   面接履歴
======================================== */

async function showHistory(
    studentId,
    studentName
){

    const historyArea =
        document.getElementById(
            "historyArea"
        );


    historyArea.innerHTML =
        "読み込み中...";


    try{

        const response =
            await fetch(
                GAS_URL +
                "?mode=history&id=" +
                encodeURIComponent(
                    studentId
                )
            );


        const history =
            await response.json();


        let html =
            "<h2>" +
            studentName +
            " の面接履歴" +
            "</h2>";


        if(history.length === 0){

            html +=
                "<p>面接履歴はありません。</p>";

        }
        else{

            html +=
                "<table>";

            html +=
                "<thead>";

            html +=
                "<tr>";

            html +=
                "<th>回数</th>";

            html +=
                "<th>日時</th>";

            html +=
                "<th>担当先生</th>";

            html +=
                "</tr>";

            html +=
                "</thead>";

            html +=
                "<tbody>";


            history.forEach(
                function(item,index){

                    const date =
                        new Date(
                            item.date
                        );


                    html +=
                        "<tr>";

                    html +=
                        "<td>" +
                        (index + 1) +
                        "回目" +
                        "</td>";

                    html +=
                        "<td>" +
                        date.toLocaleString(
                            "ja-JP"
                        ) +
                        "</td>";

                    html +=
                        "<td>" +
                        item.teacher +
                        "</td>";

                    html +=
                        "</tr>";

                }
            );


            html +=
                "</tbody>";

            html +=
                "</table>";

        }


        historyArea.innerHTML =
            html;


    }
    catch(error){

        console.error(error);


        historyArea.innerHTML =
            "履歴の取得に失敗しました。";

    }

}


/* ========================================
   更新ボタン
======================================== */

function refreshData(){

    loadSummary();

}

</script>


</body>

</html>
