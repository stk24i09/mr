<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>面接練習回数管理システム</title>

<style>

body{
    font-family:sans-serif;
    margin:30px;
    max-width:1400px;
}

/* ========================================
   ページタイトル
======================================== */

.page-title{
    text-align:center;
    margin-bottom:30px;
}


/* ========================================
   左右の画面
======================================== */

.main-container{
    display:flex;
    gap:30px;
    align-items:flex-start;
}


/* ========================================
   左側
======================================== */

.left-panel{
    width:65%;
}


/* ========================================
   右側
======================================== */

.right-panel{
    width:35%;
}


/* ========================================
   並び替え
======================================== */

.sort-area{
    margin-bottom:15px;
    display:flex;
    align-items:center;
    gap:10px;
}

.sort-area label{
    font-weight:bold;
}

#sortSelect{
    padding:8px 12px;
    font-size:16px;
}


/* ========================================
   更新ボタン
======================================== */

.refresh-button{
    padding:8px 16px;
    font-size:16px;
    cursor:pointer;
}


/* ========================================
   テーブル
======================================== */

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,
td{
    border:1px solid #ccc;
    padding:12px;
    text-align:center;
}

th{
    background:#f2f2f2;
}


/* ========================================
   生徒行
======================================== */

.student-row{
    cursor:pointer;
}

.student-row:hover{
    background:#f5f5f5;
}


/* ========================================
   試験日
======================================== */

.exam-finished{
    font-weight:bold;
}


/* ========================================
   面接履歴
======================================== */

.history-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.history-box{
    border:1px solid #ccc;
    padding:15px;
    min-height:300px;
    background:#fafafa;
}

.history-item{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.history-item:last-child{
    border-bottom:none;
}

.no-history{
    color:#777;
}

</style>

</head>


<body>


<!-- ========================================
     ページタイトル
======================================== -->

<h1 class="page-title">
    面接練習回数一覧
</h1>


<!-- ========================================
     左右の画面
======================================== -->

<div class="main-container">


    <!-- ====================================
         左側
    ===================================== -->

    <div class="left-panel">


        <!-- 並び替え -->

        <div class="sort-area">

            <label for="sortSelect">
                並び替え：
            </label>

            <select id="sortSelect">

                <option value="id-asc">
                    生徒ID順（昇順）
                </option>

                <option value="id-desc">
                    生徒ID順（降順）
                </option>

                <option value="count-desc">
                    回数順（多）
                </option>

                <option value="count-asc">
                    回数順（少）
                </option>

                <option value="exam-asc">
                    試験日順（近い順）
                </option>

                <option value="exam-desc">
                    試験日順（遠い順）
                </option>

            </select>


            <button
                class="refresh-button"
                onclick="loadData()"
            >
                更新
            </button>

        </div>


        <!-- ====================================
             生徒一覧
        ===================================== -->

        <table>

            <thead>

                <tr>

                    <th>
                        試験日
                    </th>

                    <th>
                        生徒名 / ID
                    </th>

                    <th>
                        面接回数
                    </th>

                </tr>

            </thead>


            <tbody id="studentTableBody">

            </tbody>

        </table>

    </div>



    <!-- ====================================
         右側
    ===================================== -->

    <div class="right-panel">

        <div class="history-title">
            面接履歴
        </div>

        <div
            id="historyBox"
            class="history-box"
        >

            <div class="no-history">
                生徒を選択してください。
            </div>

        </div>

    </div>


</div>



<script>


/* ========================================
   GAS API
======================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxYvNAx8TWTezWFp9V7G2UeXYkHGehDVWDdweIhdAnLaeqfzRhbpU8CONMt7CV45tj4/exec";



/* ========================================
   生徒データ
======================================== */

let students = [];



/* ========================================
   今日の日付を取得
======================================== */

function getToday(){

    const today = new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );

    return today;
}



/* ========================================
   試験日をDate型に変換
======================================== */

function getExamDate(dateText){

    if(
        !dateText ||
        dateText === "未設定"
    ){

        return null;

    }


    const parts =
        dateText.split("/");


    if(parts.length !== 3){

        return null;

    }


    const year =
        Number(parts[0]);

    const month =
        Number(parts[1]);

    const day =
        Number(parts[2]);


    if(
        isNaN(year) ||
        isNaN(month) ||
        isNaN(day)
    ){

        return null;

    }


    const date =
        new Date(
            year,
            month - 1,
            day
        );


    date.setHours(
        0,
        0,
        0,
        0
    );


    return date;

}



/* ========================================
   試験日が過ぎているか
======================================== */

function isExamFinished(dateText){

    const examDate =
        getExamDate(dateText);


    if(examDate === null){

        return false;

    }


    const today =
        getToday();


    return (
        examDate.getTime()
        <
        today.getTime()
    );

}



/* ========================================
   今日から何日後か
======================================== */

function getDaysUntilExam(dateText){

    const examDate =
        getExamDate(dateText);


    if(examDate === null){

        return null;

    }


    const today =
        getToday();


    const oneDay =
        1000 *
        60 *
        60 *
        24;


    return Math.round(
        (
            examDate.getTime()
            -
            today.getTime()
        )
        /
        oneDay
    );

}



/* ========================================
   生徒ID比較
======================================== */

function compareStudentId(a, b){

    const aMatch =
        a.id.match(/\d+[a-zA-Z](\d+)/);

    const bMatch =
        b.id.match(/\d+[a-zA-Z](\d+)/);


    if(
        !aMatch &&
        !bMatch
    ){

        return a.id.localeCompare(
            b.id
        );

    }


    if(!aMatch){

        return 1;

    }


    if(!bMatch){

        return -1;

    }


    const aNumber =
        Number(aMatch[1]);

    const bNumber =
        Number(bMatch[1]);


    if(
        aNumber !==
        bNumber
    ){

        return (
            aNumber -
            bNumber
        );

    }


    return a.id.localeCompare(
        b.id
    );

}



/* ========================================
   データ読み込み
======================================== */

async function loadData(){

    try{


        /* ================================
           面接回数取得
        ================================= */

        const summaryResponse =
            await fetch(
                API_URL +
                "?mode=summary"
            );


        const summary =
            await summaryResponse.json();



        /* ================================
           試験日取得
        ================================= */

        const examResponse =
            await fetch(
                API_URL +
                "?mode=examDates"
            );


        const examDates =
            await examResponse.json();



        students = [];



        /* ================================
           生徒データ作成
        ================================= */

        for(
            const name in summary
        ){

            const idMatch =
                name.match(
                    /\d+[a-zA-Z]\d+/
                );


            if(!idMatch){

                continue;

            }


            const studentId =
                idMatch[0];


            const examDate =
                examDates[
                    studentId
                ] || "未設定";


            students.push({

                name:name,

                id:studentId,

                count:
                    Number(
                        summary[name]
                    ) || 0,

                examDate:
                    examDate,

                finished:
                    isExamFinished(
                        examDate
                    ),

                daysUntil:
                    getDaysUntilExam(
                        examDate
                    )

            });

        }



        /* ================================
           表示
        ================================= */

        renderStudents();


    }catch(error){

        console.error(
            error
        );

        alert(
            "データの取得に失敗しました。"
        );

    }

}



/* ========================================
   生徒一覧表示
======================================== */

function renderStudents(){

    const sortType =
        document.getElementById(
            "sortSelect"
        ).value;


    /* ====================================
       生徒ID 昇順
    ==================================== */

    if(
        sortType ===
        "id-asc"
    ){

        students.sort(
            function(a,b){

                return compareStudentId(
                    a,
                    b
                );

            }
        );

    }



    /* ====================================
       生徒ID 降順
    ==================================== */

    else if(
        sortType ===
        "id-desc"
    ){

        students.sort(
            function(a,b){

                return compareStudentId(
                    b,
                    a
                );

            }
        );

    }



    /* ====================================
       回数 多い順
    ==================================== */

    else if(
        sortType ===
        "count-desc"
    ){

        students.sort(
            function(a,b){

                if(
                    a.count !==
                    b.count
                ){

                    return (
                        b.count -
                        a.count
                    );

                }


                return compareStudentId(
                    a,
                    b
                );

            }
        );

    }



    /* ====================================
       回数 少ない順
    ==================================== */

    else if(
        sortType ===
        "count-asc"
    ){

        students.sort(
            function(a,b){

                if(
                    a.count !==
                    b.count
                ){

                    return (
                        a.count -
                        b.count
                    );

                }


                return compareStudentId(
                    a,
                    b
                );

            }
        );

    }



    /* ====================================
       試験日 近い順
    ==================================== */

    else if(
        sortType ===
        "exam-asc"
    ){

        students.sort(
            function(a,b){


                /* 未設定 */

                if(
                    a.daysUntil === null &&
                    b.daysUntil === null
                ){

                    return compareStudentId(
                        a,
                        b
                    );

                }


                if(
                    a.daysUntil === null
                ){

                    return 1;

                }


                if(
                    b.daysUntil === null
                ){

                    return -1;

                }



                /* まだ試験日前 */

                if(
                    !a.finished &&
                    !b.finished
                ){

                    if(
                        a.daysUntil !==
                        b.daysUntil
                    ){

                        return (
                            a.daysUntil -
                            b.daysUntil
                        );

                    }


                    return compareStudentId(
                        a,
                        b
                    );

                }



                /* 試験日前を上 */

                if(
                    !a.finished &&
                    b.finished
                ){

                    return -1;

                }


                if(
                    a.finished &&
                    !b.finished
                ){

                    return 1;

                }



                /* 両方試験日経過 */

                if(
                    a.daysUntil !==
                    b.daysUntil
                ){

                    return (
                        b.daysUntil -
                        a.daysUntil
                    );

                }


                return compareStudentId(
                    a,
                    b
                );

            }
        );

    }



    /* ====================================
       試験日 遠い順
    ==================================== */

    else if(
        sortType ===
        "exam-desc"
    ){

        students.sort(
            function(a,b){


                /* 未設定 */

                if(
                    a.daysUntil === null &&
                    b.daysUntil === null
                ){

                    return compareStudentId(
                        a,
                        b
                    );

                }


                if(
                    a.daysUntil === null
                ){

                    return 1;

                }


                if(
                    b.daysUntil === null
                ){

                    return -1;

                }



                /* まだ試験日前 */

                if(
                    !a.finished &&
                    !b.finished
                ){

                    if(
                        a.daysUntil !==
                        b.daysUntil
                    ){

                        return (
                            b.daysUntil -
                            a.daysUntil
                        );

                    }


                    return compareStudentId(
                        a,
                        b
                    );

                }



                /* 試験日前を上 */

                if(
                    !a.finished &&
                    b.finished
                ){

                    return -1;

                }


                if(
                    a.finished &&
                    !b.finished
                ){

                    return 1;

                }



                /* 両方試験日経過 */

                if(
                    a.daysUntil !==
                    b.daysUntil
                ){

                    return (
                        b.daysUntil -
                        a.daysUntil
                    );

                }


                return compareStudentId(
                    a,
                    b
                );

            }
        );

    }



    /* ====================================
       テーブル表示
    ==================================== */

    const tbody =
        document.getElementById(
            "studentTableBody"
        );


    tbody.innerHTML = "";



    students.forEach(
        function(student){

            const tr =
                document.createElement(
                    "tr"
                );


            tr.className =
                "student-row";



            /* ============================
               試験日
            ============================ */

            let examDateHtml;


            if(
                student.examDate ===
                "未設定"
            ){

                examDateHtml =
                    "未設定";

            }

            else if(
                student.finished
            ){

                /*
                 * 試験日が過ぎた場合
                 * 「✓」ではなく「✅」
                 */

                examDateHtml =
                    `<span class="exam-finished">
                        ${student.examDate} ✅
                    </span>`;

            }

            else{

                examDateHtml =
                    student.examDate;

            }



            /* ============================
               行の内容
            ============================ */

            tr.innerHTML = `

                <td>
                    ${examDateHtml}
                </td>

                <td>
                    ${student.name}
                </td>

                <td>
                    ${student.count}回
                </td>

            `;



            /* ============================
               クリック
            ============================ */

            tr.addEventListener(
                "click",
                function(){

                    showHistory(
                        student
                    );

                }
            );


            tbody.appendChild(
                tr
            );

        }
    );

}



/* ========================================
   面接履歴表示
======================================== */

async function showHistory(student){

    const historyBox =
        document.getElementById(
            "historyBox"
        );


    historyBox.innerHTML =
        `<div>
            ${student.name} の面接履歴を読み込み中...
        </div>`;


    try{

        const response =
            await fetch(
                API_URL +
                "?mode=history&id=" +
                encodeURIComponent(
                    student.id
                )
            );


        const history =
            await response.json();



        /* ================================
           タイトル
        ================================= */

        let html = `

            <div
                style="
                    font-size:20px;
                    font-weight:bold;
                    margin-bottom:15px;
                "
            >
                ${student.name} の面接履歴
            </div>

        `;



        /* ================================
           履歴なし
        ================================= */

        if(
            history.length === 0
        ){

            html += `

                <div class="no-history">
                    面接履歴はありません。
                </div>

            `;

        }



        /* ================================
           履歴表示
        ================================= */

        else{

            history.forEach(
                function(item){

                    let dateText =
                        item.date;


                    /* ======================
                       日付を表示
                    ====================== */

                    if(
                        item.date instanceof Object
                    ){

                        dateText =
                            String(
                                item.date
                            );

                    }


                    html += `

                        <div class="history-item">

                            <div>
                                ${dateText}
                            </div>

                            <div>
                                先生：
                                ${item.teacher}
                            </div>

                        </div>

                    `;

                }
            );

        }



        historyBox.innerHTML =
            html;


    }catch(error){

        console.error(
            error
        );


        historyBox.innerHTML = `

            <div class="no-history">
                面接履歴の取得に失敗しました。
            </div>

        `;

    }

}



/* ========================================
   並び替え変更
======================================== */

document
    .getElementById(
        "sortSelect"
    )
    .addEventListener(
        "change",
        function(){

            renderStudents();

        }
    );



/* ========================================
   初回読み込み
======================================== */

loadData();


</script>


</body>

</html>
